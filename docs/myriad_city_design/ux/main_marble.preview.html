<!doctype html>
<meta charset="utf-8">
<title>宇宙弹弹乐 · 活动主界面（定版布局）</title>
<style>
/* ===========================================================================
   p2ux19.css —— P2 / AOA 交互稿图元库 v2
   画布 1920×1080（照《分层累充-新累充》真实 Figma 稿，不是 skill 里写的 1376×768）

   ⛔ 与 v1(p2uxkit.css) 的根本差别：
      这不是线框。P2 的交互稿是**用真实游戏切图拼的高保真稿**。
      chrome（导航条/页签/按钮/奖励格/面板）一律引 assets/ 里的真图，
      CSS 只负责定位与文字，不用 CSS 仿造游戏控件。

   色值全部取样自真实稿：
      导航底 #1A1A1A · 返回按钮 #2E2E2E · 任务面板 #161013
      选中黄 #FFC600 · 领取绿 #3EEE00 · 前往蓝 #00CFEE · 分组标题橙 #E8A020
   =========================================================================== */

:root {
  --nav-bg:     #1A1A1A;
  --panel-bg:   #161013;
  --gold:       #FFC600;
  --green:      #3EEE00;
  --cyan:       #00CFEE;
  --group-ink:  #E8A020;   /* 分组标题「热门活动」那个橙 */
  --ink:        #FFFFFF;
  --ink-2:      #C8CDD4;
  --stroke:     #1A1A1A;   /* 文字描边色，P2 全站统一深色 */

  /* 标注层：真实稿只用青色一色，白标题 + 青说明 */
  --note:       #3ED8E0;
  --note-t:     #FFFFFF;
  --board-bg:   #0D0D0D;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--board-bg); }

/* —— 单屏画布：1920×1080，规范硬尺寸 —— */
.screen {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  font-family: "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink);
}
.abs { position: absolute; }
img  { display: block; }

/* —— P2 文字：粗黑体 + 粗深色描边，是这个项目最强的视觉签名 —— */
.t {
  font-weight: 900; color: var(--ink);
  -webkit-text-stroke: 4px var(--stroke); paint-order: stroke fill;
}
.t.sm  { -webkit-text-stroke-width: 3px; }
.t.xs  { -webkit-text-stroke-width: 2px; }
.t.none{ -webkit-text-stroke-width: 0; }
.t.gold  { color: var(--gold); }
.t.green { color: var(--green); }
.t.cyan  { color: var(--cyan); }
.t.dark  { color: #3A2A00; -webkit-text-stroke-width: 0; }   /* 压在黄底上的字 */
.t.group { color: var(--group-ink); -webkit-text-stroke-width: 0; font-weight: 700; }

/* —— 导航条：369×1080，底板/返回/分组条/页签全部引真图 —— */
.nav      { left: 0; top: 0; width: 369px; height: 1080px; }
.nav-tab-hit  { display: flex; align-items: center; justify-content: center; }

/* —— 右侧任务面板：739×898 —— */
.taskpanel { width: 739px; height: 898px; background: var(--panel-bg); border-radius: 10px; }
.taskrow   { width: 704px; height: 192px; }
.taskrow.alt { background: rgba(255,255,255,.045); }

/* —— 美术槽位：还没跑图的位置。虚线青框 + 居中标签 —— */
.slot {
  border: 3px dashed rgba(62,216,224,.55); border-radius: 10px;
  background: rgba(62,216,224,.05);
  display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--note); font-size: 22px; font-weight: 700; line-height: 1.45;
}
.slot.top { align-items: flex-start; padding-top: 14px; }
.slot.corner { align-items: flex-end; justify-content: flex-start; padding: 0 0 22px 396px; }

/* ===========================================================================
   板式：黑底大画板 + （1）（2）章节 + 青色标注 + 箭头
   照《分层累充-新累充》的排版语言
   =========================================================================== */
.board { position: relative; background: var(--board-bg); }

.board-title { display: flex; align-items: center; gap: 26px; }
.board-title .bar { width: 44px; height: 76px; background: var(--note); }
.board-title .txt { font-size: 76px; font-weight: 900; color: #fff; }

.sec { font-size: 50px; font-weight: 700; color: #fff; }      /* （1）策划需求 */
.cap { font-size: 34px; font-weight: 700; color: #fff; }      /* 每张界面上方的白标题 */

/* 标注：白色粗体标题 + 青色说明行 */
.note-t  { font-size: 30px; font-weight: 700; color: var(--note-t); }
.note-d  { font-size: 28px; color: var(--note); line-height: 1.5; }
.note-d.r{ text-align: right; }

/* 引线：青色细线 + 箭头 */
.ln  { background: var(--note); height: 3px; }
.ln.v{ width: 3px; height: auto; }
.ar  { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.ar.l{ border-right: 18px solid var(--note); }
.ar.r{ border-left: 18px solid var(--note); }

/* 状态序列块：浅灰圆角底 + 蓝色粗箭头 */
.seq     { background: #2E2E2E; border-radius: 18px; }
.seq-cap { font-size: 32px; font-weight: 700; color: #fff; }
.bigar   { width: 0; height: 0; border-top: 26px solid transparent;
           border-bottom: 26px solid transparent; border-left: 46px solid var(--cyan); }

</style>

  <div class="board-title abs" style="left:120px;top:44px" data-layer="板标题" data-name="板标题">
    <div class="bar"></div><div class="txt">宇宙弹弹乐 · 活动主界面</div>
  </div>
  <div class="note-d abs" style="left:186px;top:140px;width:1900px" data-layer="板说明" data-name="板说明">

  </div>
</div>

      入槽进度 Buff       → 槽条右下角（母版那里是 0/8）

        return `<div class="abs" style="${base}" ${L('页签-' + txt + ' 一级选中')}>

          ${dot ? badge(-10, -10, dot) : ''}${isNew ? newTag(300, -12) : ''}</div>`;
      }
      if (kind === 'sub') {
        return `<div class="abs" style="${base}" ${L('页签-' + txt + ' 二级选中')}>
          <div class="abs" style="left:18px;top:0;width:304px;height:88px;background:${C.tabC};border:4px solid #0A5A78;border-radius:12px"></div>

      }
      return `<div class="abs" style="${base}" ${L('页签-' + txt)}>
        <div class="abs" style="left:0;top:0;width:340px;height:104px;background:${C.navItem};border-bottom:2px solid #232323"></div>
        <div class="t abs" style="left:0;top:0;width:340px;height:104px;display:flex;align-items:center;justify-content:center;font-size:40px;color:#B6BCC4">${txt}</div>

    };
    const badge = (x, y, n) => `<div class="abs" style="left:${x}px;top:${y}px;width:40px;height:40px;border-radius:50%;background:#E02020;border:3px solid #7A0C0C;display:flex;align-items:center;justify-content:center" ${L('红点')}><div class="t" style="font-size:24px">${n}</div></div>`;

    const warnTag = (x, y) => `<div class="abs" style="left:${x}px;top:${y}px;width:40px;height:40px;border-radius:50%;background:#E02020;border:3px solid #7A0C0C;display:flex;align-items:center;justify-content:center" ${L('待处理感叹号')}><div class="t" style="font-size:26px">!</div></div>`;

  // ── 右上资产条：黑半透明 + 绿方块【+】 ──
  function assets(s) {
    const chip = (icon, num, x, name) => `
      <div class="abs" style="left:${x}px;top:0;width:250px;height:66px" ${L(name)}>
        <div class="abs" style="left:0;top:0;width:196px;height:66px;background:rgba(8,10,14,.82);border-radius:12px"></div>
        <img class="abs" style="left:-8px;top:2px" width="62" height="62" src="${A}task/${icon}">
        <div class="t abs" style="left:62px;top:0;width:126px;height:66px;display:flex;align-items:center;justify-content:flex-end;font-size:34px">${num}</div>
        <div class="abs" style="left:200px;top:0;width:50px;height:66px;background:${C.green};border:3px solid ${C.greenDark};border-radius:12px;display:flex;align-items:center;justify-content:center" ${L('加号-跳礼包')}>
          <div class="t" style="font-size:40px">+</div></div></div>`;
    return `<div class="abs" style="left:1380px;top:16px;width:520px;height:66px" ${L('资产条')}>
      ${chip('../marble/弹珠_紫.png', s.balls, 0, '资产-弹珠')}
      ${chip('../marble/弹珠_金.png', s.adv, 270, '资产-高级弹珠')}</div>`;
  }

  // ── ① 弹珠机：顶棚 + 一关进度条 + 全同撞柱 + 倍数槽(含触发槽) ──
  //    撞柱全部一样，按撞中次数加分；积分满一关领奖后重置、场数+1。没有阶段奖励。
  function machine(s) {
    const MX = 500, MY = 112, MW = 840, MH = 906;
    const IX = MX + 36, IW = MW - 72;
    const PY = MY + 122;                 // 一关进度条
    const HY = MY + 192;                 // 实时读数条
    const IY = MY + 244, IH = 440;       // 盘面
    const live = s.hits > 0 || s.flying;
    const need = s.need || 120, cur = s.round || 0;

    const inlet = `<img class="abs" style="left:${MX + MW / 2 - 210}px;top:${MY + 40}px;width:420px;height:80px${s.flying ? ';filter:grayscale(.7) brightness(.75)' : ''}" src="${MB}顶棚发射横杆.png" ${L('入球口横杆' + (s.flying ? ' 出球中' : ''))}>`;

    // 一关进度条：撞柱得积分 → 满 need 领本关奖励 → 重置、场数+1
    const done = cur >= need;
    const roundBar = `<div class="abs" style="left:${IX}px;top:${PY}px;width:${IW}px;height:64px" ${L('一关进度条')}>
      <img class="abs" style="left:0;top:-6px;width:76px;height:76px" src="${MB}积分币.png" ${L('本关奖励图标(真切图)')}>
      <div class="abs" style="left:90px;top:8px;width:${IW - 220}px;height:48px;background:#241A10;border:5px solid #7A5A34;border-radius:24px"></div>
      <div class="abs" style="left:95px;top:13px;width:${(IW - 230) * Math.min(1, cur / need)}px;height:38px;background:linear-gradient(180deg,${done ? '#8CE84A,#3EAE12' : '#F06AFF,#E040FB'});border-radius:19px" ${L('本关进度填充')}></div>
      <div class="t abs" style="left:90px;top:8px;width:${IW - 220}px;height:48px;display:flex;align-items:center;justify-content:center;font-size:30px">${cur} / ${need}</div>
      <div class="abs" style="left:${IW - 116}px;top:-6px;width:116px;height:76px" ${L('场数')}>
        <img class="abs" style="left:12px;top:-8px;width:92px;height:92px" src="${MB}星_场数.png">
        <div class="t abs" style="left:12px;top:6px;width:92px;height:70px;display:flex;align-items:center;justify-content:center;font-size:36px;-webkit-text-stroke-width:5px">${s.stage || 1}</div>
        <div class="t abs sm" style="left:0;top:-30px;width:116px;text-align:center;font-size:22px;white-space:nowrap">场数</div></div></div>`;

    // 钉子 + 撞柱：撞柱全部一样，不带数字、不分高低
    let pegs = '';
    const POSTS = new Set(['1-3', '3-1', '3-5', '5-2', '5-4', '2-0', '2-6']);
    for (let r = 0; r < 7; r++) {
      const n = r % 2 === 0 ? 8 : 7;
      const y = IY + 40 + r * ((IH - 110) / 6);
      const gap = (IW - 110) / (n - 1 + (r % 2 === 0 ? 0 : 1));
      for (let c = 0; c < n; c++) {
        const x = IX + 55 + c * gap + (r % 2 ? gap / 2 : 0);
        if (POSTS.has(r + '-' + c)) {
          pegs += `<img class="abs" style="left:${x - 27}px;top:${y - 27}px;width:54px;height:54px${s.dead ? ';filter:grayscale(1) brightness(.6)' : ''}" src="${MB}圆钮_黄大.png" ${L('撞柱' + (s.dead ? ' 熄灭' : ''))}>`;
        } else {
          pegs += `<div class="abs" style="left:${x - 8}px;top:${y - 8}px;width:16px;height:16px;border-radius:50%;background:#F0E0C0;box-shadow:0 3px 0 #A88848"></div>`;
        }
      }
    }

    // 底部倍数槽 ×1 ×2 ×3 ×10 ×3 ×2 ×1；其中随机 1 个为触发槽（落入才累计，满则抽 Buff 后重随机）
    const vals = [1, 2, 3, 10, 3, 2, 1];
    const sy = MY + MH - 208;
    const trig = s.trigSlot === undefined ? 4 : s.trigSlot;
    const tFull = s.gauge[0] >= s.gauge[1];
    const slots = vals.map((v, i) => {
      const w = IW / 7, x = IX + i * w, hot = v === 10, hit = s.slot === i, isT = i === trig;
      return `<div class="abs" style="left:${x}px;top:${sy}px;width:${w}px;height:140px" ${L('槽' + (i + 1) + '-x' + v + (isT ? ' 触发槽' : '') + (hit ? ' 命中' : ''))}>
        ${isT ? `<div class="abs" style="left:${w / 2 - 44}px;top:-44px;width:88px;height:42px;background:${tFull ? '#FFC61E' : 'rgba(8,10,14,.86)'};border:4px solid #FFC61E;border-radius:21px;display:flex;align-items:center;justify-content:center" ${L('触发槽计数')}>
              <div class="t ${tFull ? 'dark' : 'gold'}" style="font-size:26px">${s.gauge[0]}/${s.gauge[1]}</div></div>` : ''}
        <div class="abs" style="left:${w / 2 - 34}px;top:0;width:68px;height:68px;border-radius:50%${isT ? ';box-shadow:0 0 0 5px rgba(255,198,30,.55),0 0 24px 6px rgba(255,198,30,.55)' : ''}${hit ? ';box-shadow:0 0 0 6px #FFFFFF' : ''}">
          <img class="abs" style="left:0;top:0;width:68px;height:68px" src="${MB}圆钮_${hot ? '黄大' : isT ? '紫大' : '蓝大'}.png">
          <div class="t abs" style="left:0;top:0;width:68px;height:68px;display:flex;align-items:center;justify-content:center;font-size:${hot ? 30 : 26}px">×${v}</div></div>
        <div class="t ${isT ? 'gold' : ''} abs sm" style="left:${w / 2 - 60}px;top:74px;width:120px;text-align:center;font-size:22px;white-space:nowrap;${isT ? '' : 'color:#C8CDD4'}">${isT ? '触发槽' : ''}</div></div>`;
    }).join('');
    const trigNote = `<div class="t cyan abs sm" style="left:${IX}px;top:${MY + MH - 46}px;width:${IW}px;text-align:center;font-size:22px;line-height:1.4" ${L('触发槽说明')}>落入<b>触发槽</b>才累计　·　满 ${s.gauge[1]} 次抽 Buff 后<b>重新随机</b>一个槽</div>`;

    return `
    <img class="abs" style="left:${MX - 30}px;top:${MY + 66}px;width:${MW + 60}px;height:${MH - 46}px" src="${MB}机身_空盘框.png" ${L('弹珠机身(真切图)')}>
    <img class="abs" style="left:${MX + MW / 2 - 330}px;top:${MY - 10}px;width:660px;height:130px" src="${MB}拱顶蓝盖.png" ${L('拱形顶棚(真切图)')}>
    ${inlet}${roundBar}
    <div class="abs" style="left:${IX}px;top:${HY}px;width:${IW}px;height:44px;background:${live ? 'rgba(8,10,16,.85)' : 'rgba(0,0,0,.42)'};border-radius:8px;display:flex;align-items:center;justify-content:center;gap:14px" ${L('⑨ ' + (live ? '本次发射实时信息' : '操作提示条'))}>
      ${live
        ? `<div class="t sm" style="font-size:26px">撞击</div><div class="t ${s.burst ? 'gold' : 'cyan'}" style="font-size:32px">${s.hits} / 11</div>
           <div class="t sm" style="font-size:26px;color:#8A929B">·</div>
           <div class="t sm" style="font-size:26px">本发累计</div><div class="t gold" style="font-size:32px">${s.acc.toLocaleString()}</div>`
        : `<div class="t sm" style="font-size:26px">撞柱按次数加分　·　满 ${need} 分领本关奖励，重置进下一场</div>`}</div>
    <div class="abs" style="left:${IX}px;top:${IY}px;width:${IW}px;height:${IH}px" ${L('盘面区')}></div>
    ${pegs}
    ${s.trail ? s.trail.map((p, i) => `<div class="abs" style="left:${IX + p[0] - 9}px;top:${IY + p[1] - 9}px;width:18px;height:18px;border-radius:50%;background:${s.advSel ? '#FFC61E' : '#EAF2FF'};opacity:${.16 + i * .14}"></div>`).join('') : ''}
    ${s.ball ? `<div class="abs" style="left:${IX + s.ball[0] - 22}px;top:${IY + s.ball[1] - 22}px;width:44px;height:44px;border-radius:50%;box-shadow:0 0 26px 8px ${s.advSel ? 'rgba(255,198,30,.8)' : 'rgba(190,120,255,.75)'}" ${L('弹珠')}><img style="position:absolute;left:0;top:0;width:44px;height:44px" src="${MB}弹珠_${s.advSel ? '金' : '紫'}.png"></div>` : ''}

<script>
/* ===========================================================================
   svgbake.js —— 把 .canvas 的 DOM 布局结果「烘焙」成分组命名的 SVG
   目的：HTML 负责排版（flex 好用），SVG 负责交付（Figma 拖进去自动成图层树）

   规则：
     [data-layer]  → <g id="名字">，容器嵌套，图层名 = 属性值
     [data-slot]   → 美术槽位，出一个命名好的空框（后续贴 AI 图）
     [data-note]   → 标注，统一收进最外层 <g id="标注层">，Figma 里一键隐藏

   烘焙结果写进 <script type="text/plain" id="__svg__">，供 render_ux.py 用
   Chrome --dump-dom 取走。
   =========================================================================== */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  let origin = { x: 0, y: 0 };
  const defs = [];
  let gradSeq = 0;

  const esc = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const n = (v) => Math.round(v * 100) / 100;

  // —— 颜色：rgba(…) → {hex, opacity}；透明返回 null ——
  function color(css) {
    if (!css) return null;
    const m = css.match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    const p = m[1].split(',').map((x) => parseFloat(x.trim()));
    const a = p.length > 3 ? p[3] : 1;
    if (a === 0) return null;
    const hex = '#' + p.slice(0, 3)
      .map((c) => Math.round(c).toString(16).padStart(2, '0')).join('');
    return { hex, opacity: a };
  }

  // —— linear-gradient(180deg, #A 0%, #B 100%) → <linearGradient> ——
  function gradient(bgImage) {
    if (!bgImage || bgImage.indexOf('linear-gradient') < 0) return null;
    if (bgImage.indexOf('repeating-linear-gradient') === 0) return null; // 斜纹底：走纯色回落
    // ⛔ radial-gradient 不支持 —— 用了会烘焙成「无填充」，元素变空心。
    //    kit 里一律用 linear-gradient 代替，别图省事写 radial。
    const inner = bgImage.slice(bgImage.indexOf('(') + 1, bgImage.lastIndexOf(')'));
    const parts = inner.split(/,(?![^(]*\))/).map((s) => s.trim());
    let deg = 180;
    if (/^-?[\d.]+deg$/.test(parts[0])) deg = parseFloat(parts.shift());
    else if (/^to /.test(parts[0])) { const d = parts.shift(); deg = /right/.test(d) ? 90 : 180; }
    const stops = [];
    parts.forEach((p, i) => {
      const c = color(p);
      if (!c) return;
      const pm = p.match(/([\d.]+)%\s*$/);
      const off = pm ? parseFloat(pm[1]) : (i / Math.max(1, parts.length - 1)) * 100;
      stops.push({ c, off });
    });
    if (stops.length < 2) return null;
    // deg: 0=向上, 90=向右, 180=向下（CSS 定义）
    const rad = (deg - 90) * Math.PI / 180;
    const x1 = n(50 - Math.cos(rad) * 50), y1 = n(50 - Math.sin(rad) * 50);
    const x2 = n(50 + Math.cos(rad) * 50), y2 = n(50 + Math.sin(rad) * 50);
    const id = 'g' + (++gradSeq);
    defs.push(
      `<linearGradient id="${id}" x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%">` +
      stops.map((s) => `<stop offset="${n(s.off)}%" stop-color="${s.c.hex}" stop-opacity="${s.c.opacity}"/>`).join('') +
      `</linearGradient>`
    );
    return `url(#${id})`;
  }

  function rectOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left - origin.x, y: r.top - origin.y, w: r.width, h: r.height };
  }

  function radius(cs, r) {
    const v = cs.borderTopLeftRadius || '0px';
    if (v.indexOf('%') >= 0) return Math.min(r.w, r.h) / 2;
    return parseFloat(v) || 0;
  }

  // —— 元素自身的底板：背景 + 描边 ——
  function boxOf(el, cs, r) {
    const out = [];
    const rx = n(radius(cs, r));
    const grad = gradient(cs.backgroundImage);
    const bg = color(cs.backgroundColor);
    const fill = grad || (bg ? bg.hex : null);
    const fillOp = grad ? 1 : (bg ? bg.opacity : 0);

    const bw = parseFloat(cs.borderTopWidth) || 0;
    const bc = color(cs.borderTopColor);
    const dashed = cs.borderTopStyle === 'dashed';

    if (fill) {
      out.push(`<rect x="${n(r.x)}" y="${n(r.y)}" width="${n(r.w)}" height="${n(r.h)}"` +
        (rx ? ` rx="${rx}"` : '') + ` fill="${fill}"` +
        (fillOp < 1 ? ` fill-opacity="${n(fillOp)}"` : '') + `/>`);
    }
    if (bw > 0 && bc) {
      const i = bw / 2;
      out.push(`<rect x="${n(r.x + i)}" y="${n(r.y + i)}" width="${n(Math.max(0, r.w - bw))}"` +
        ` height="${n(Math.max(0, r.h - bw))}"` + (rx ? ` rx="${n(Math.max(0, rx - i))}"` : '') +
        ` fill="none" stroke="${bc.hex}" stroke-width="${n(bw)}"` +
        (bc.opacity < 1 ? ` stroke-opacity="${n(bc.opacity)}"` : '') +
        (dashed ? ` stroke-dasharray="5 4"` : '') + `/>`);
    }
    return out;
  }

  // —— 文字：用 Range 逐行量，位置与 Chrome 排版一致 ——
  function lineBoxes(node) {
    const s = node.textContent;
    const a = s.search(/\S/), b = s.search(/\s*$/);
    if (a < 0) return [];
    const rg = document.createRange();
    const out = [];
    let start = a;
    for (let i = a + 1; i <= b; i++) {
      rg.setStart(node, start); rg.setEnd(node, i);
      if (rg.getClientRects().length > 1) {
        rg.setStart(node, start); rg.setEnd(node, i - 1);
        out.push({ text: s.slice(start, i - 1), r: rg.getBoundingClientRect() });
        start = i - 1;
        while (start < b && /\s/.test(s[start])) start++;
      }
    }
    rg.setStart(node, start); rg.setEnd(node, b);
    out.push({ text: s.slice(start, b), r: rg.getBoundingClientRect() });
    return out.filter((o) => o.text.trim());
  }

  function textOf(el, cs) {
    const out = [];
    const fill = color(cs.color);
    if (!fill) return out;
    const fs = parseFloat(cs.fontSize) || 13;
    const fw = cs.fontWeight;
    const fam = 'PingFang SC, Noto Sans SC, sans-serif';
    for (const node of el.childNodes) {
      if (node.nodeType !== 3 || !node.textContent.trim()) continue;
      for (const ln of lineBoxes(node)) {
        const x = ln.r.left - origin.x;
        const y = ln.r.top - origin.y + ln.r.height * 0.765;   // 近似基线：实测对齐 Chrome 排版，别乱调
        const sw = parseFloat(cs.webkitTextStrokeWidth) || 0;
        const sc = sw > 0 ? color(cs.webkitTextStrokeColor) : null;
        out.push(`<text x="${n(x)}" y="${n(y)}" font-family="${fam}" font-size="${n(fs)}"` +
          (fw && fw !== '400' ? ` font-weight="${fw}"` : '') +
          ` fill="${fill.hex}"` + (fill.opacity < 1 ? ` fill-opacity="${n(fill.opacity)}"` : '') +
          (sc ? ` stroke="${sc.hex}" stroke-width="${n(sw * 2)}" paint-order="stroke"` +
                ` stroke-linejoin="round"` : '') +
          ` xml:space="preserve">${esc(ln.text.trim())}</text>`);
      }
    }
    return out;
  }

  // 图片转 data URI —— SVG 必须自包含，Figma 解析不了外链
  const uriCache = new Map();
  function dataURI(img) {
    const key = img.currentSrc || img.src;
    if (uriCache.has(key)) return uriCache.get(key);
    let out = key;
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      out = c.toDataURL('image/png');
    } catch (e) { /* 取不到就退回原始 src，至少 PNG 那一路还是对的 */ }
    uriCache.set(key, out);
    return out;
  }

  function imgOf(el, r) {
    if (el.tagName !== 'IMG' || !el.naturalWidth) return [];
    const fit = getComputedStyle(el).objectFit === 'fill' ? 'none' : 'xMidYMid meet';
    return [`<image x="${n(r.x)}" y="${n(r.y)}" width="${n(r.w)}" height="${n(r.h)}"` +
      ` preserveAspectRatio="${fit}" href="${dataURI(el)}"/>`];
  }

  const isNoteRoot = (el) =>
    el.hasAttribute('data-note') &&
    !(el.parentElement && el.parentElement.closest('[data-note]'));

  // —— 主遍历 ——
  function walk(el, skipNotes) {
    if (el.nodeType !== 1) return '';
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') return '';
    if (skipNotes && isNoteRoot(el)) return '';

    const r = rectOf(el);
    const body = [];
    if (r.w > 0 && r.h > 0) body.push(...boxOf(el, cs, r), ...imgOf(el, r));
    body.push(...textOf(el, cs));
    for (const kid of el.children) body.push(walk(kid, skipNotes));

    const inner = body.filter(Boolean).join('');
    if (!inner) return '';

    const name = el.getAttribute('data-layer') || el.getAttribute('data-slot');
    if (!name) return inner;
    const op = parseFloat(cs.opacity);
    return `<g id="${esc(name)}" data-name="${esc(name)}"` +
      (op < 1 ? ` opacity="${n(op)}"` : '') + `>${inner}</g>`;
  }

  function bake() {
    const canvas = document.querySelector('.canvas');
    const cr = canvas.getBoundingClientRect();
    origin = { x: cr.left, y: cr.top };
    const W = Math.round(cr.width), H = Math.round(cr.height);

    const main = walk(canvas, true);
    const notes = [...canvas.querySelectorAll('[data-note]')]
      .filter(isNoteRoot).map((el) => walk(el, false)).filter(Boolean).join('');

    const bg = color(getComputedStyle(canvas).backgroundColor);
    return `<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
      (defs.length ? `<defs>${defs.join('')}</defs>` : '') +
      (bg ? `<rect width="${W}" height="${H}" fill="${bg.hex}"/>` : '') +
      main +
      (notes ? `<g id="标注层" data-name="标注层">${notes}</g>` : '') +
      `</svg>`;
  }

  function run() {
    const svg = bake();
    let holder = document.getElementById('__svg__');
    if (!holder) {
      holder = document.createElement('script');
      holder.type = 'text/plain'; holder.id = '__svg__';
      document.body.appendChild(holder);
    }
    holder.textContent = svg;
    // 上报每一屏的实测尺寸 —— 规范要求「出图后必须校验像素」，交给 render_ux.py 断言
    holder.setAttribute('data-screens', [...document.querySelectorAll('.screen')]
      .map((e) => { const r = e.getBoundingClientRect();
                    return Math.round(r.width) + 'x' + Math.round(r.height); }).join(','));
    document.documentElement.setAttribute('data-baked', '1');
  }

  if (document.readyState === 'complete') run();
  else window.addEventListener('load', () => setTimeout(run, 60));
})();

</script>

<div id="__bar">
  <button id="__out">&minus;</button><span class="pct" id="__pct">100%</span><button id="__in">+</button>
  <span class="sep"></span>
  <button id="__fw">适应宽度</button><button id="__fh">整板</button><button id="__11">100%</button>
</div>
<script>
(function () {
  var b = document.querySelector('.canvas') || document.body.firstElementChild;
  var W = b.offsetWidth, H = b.offsetHeight;
  var vp = document.createElement('div'); vp.id = '__vp';
  b.parentNode.insertBefore(vp, b); vp.appendChild(b);
  b.style.transformOrigin = '0 0';
  var k = 1;
  function apply(n) {
    k = Math.min(2, Math.max(0.03, n));
    b.style.transform = 'scale(' + k + ')';
    vp.style.width = (W * k) + 'px'; vp.style.height = (H * k) + 'px';
    document.getElementById('__pct').textContent = Math.round(k * 100) + '%';
  }
  var fw = function () { apply((innerWidth - 36) / W); };
  var fh = function () { apply(Math.min((innerWidth - 36) / W, (innerHeight - 36) / H)); };
  document.getElementById('__in').onclick  = function () { apply(k * 1.25); };
  document.getElementById('__out').onclick = function () { apply(k / 1.25); };
  document.getElementById('__fw').onclick  = fw;
  document.getElementById('__fh').onclick  = fh;
  document.getElementById('__11').onclick  = function () { apply(1); };
  addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); apply(k * 1.25); }
    if (e.key === '-') { e.preventDefault(); apply(k / 1.25); }
    if (e.key === '0') { e.preventDefault(); fw(); }
  });
  // 按住空格拖动平移
  var pan = false, sx, sy, ox, oy;
  addEventListener('mousedown', function (e) {
    if (e.target.closest('#__bar')) return;
    pan = true; sx = e.clientX; sy = e.clientY; ox = scrollX; oy = scrollY;
    document.body.style.cursor = 'grabbing';
  });
  addEventListener('mousemove', function (e) {
    if (pan) scrollTo(ox - (e.clientX - sx), oy - (e.clientY - sy));
  });
  addEventListener('mouseup', function () { pan = false; document.body.style.cursor = ''; });
  fw();
})();
</script>

      导航底 #1A1A1A · 返回按钮 #2E2E2E · 任务面板 #161013

   =========================================================================== */

:root {
  --nav-bg:     #1A1A1A;
  --panel-bg:   #161013;
  --gold:       #FFC600;
  --green:      #3EEE00;
  --cyan:       #00CFEE;
  --group-ink:  #E8A020;   /* 分组标题「热门活动」那个橙 */
  --ink:        #FFFFFF;
  --ink-2:      #C8CDD4;
  --stroke:     #1A1A1A;   /* 文字描边色，P2 全站统一深色 */

  /* 标注层：真实稿只用青色一色，白标题 + 青说明 */
  --note:       #3ED8E0;
  --note-t:     #FFFFFF;
  --board-bg:   #0D0D0D;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--board-bg); }

/* —— 单屏画布：1920×1080，规范硬尺寸 —— */
.screen {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  font-family: "PingFang SC", "Noto Sans SC", sans-serif; color: var(--ink);
}
.abs { position: absolute; }
img  { display: block; }

/* —— P2 文字：粗黑体 + 粗深色描边，是这个项目最强的视觉签名 —— */
.t {
  font-weight: 900; color: var(--ink);
  -webkit-text-stroke: 4px var(--stroke); paint-order: stroke fill;
}
.t.sm  { -webkit-text-stroke-width: 3px; }
.t.xs  { -webkit-text-stroke-width: 2px; }
.t.none{ -webkit-text-stroke-width: 0; }
.t.gold  { color: var(--gold); }
.t.green { color: var(--green); }
.t.cyan  { color: var(--cyan); }
.t.dark  { color: #3A2A00; -webkit-text-stroke-width: 0; }   /* 压在黄底上的字 */
.t.group { color: var(--group-ink); -webkit-text-stroke-width: 0; font-weight: 700; }

/* —— 导航条：369×1080，底板/返回/分组条/页签全部引真图 —— */
.nav      { left: 0; top: 0; width: 369px; height: 1080px; }
.nav-tab-hit  { display: flex; align-items: center; justify-content: center; }

/* —— 右侧任务面板：739×898 —— */
.taskpanel { width: 739px; height: 898px; background: var(--panel-bg); border-radius: 10px; }
.taskrow   { width: 704px; height: 192px; }
.taskrow.alt { background: rgba(255,255,255,.045); }

/* —— 美术槽位：还没跑图的位置。虚线青框 + 居中标签 —— */
.slot {
  border: 3px dashed rgba(62,216,224,.55); border-radius: 10px;
  background: rgba(62,216,224,.05);
  display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--note); font-size: 22px; font-weight: 700; line-height: 1.45;
}
.slot.top { align-items: flex-start; padding-top: 14px; }
.slot.corner { align-items: flex-end; justify-content: flex-start; padding: 0 0 22px 396px; }

/* ===========================================================================
   板式：黑底大画板 + （1）（2）章节 + 青色标注 + 箭头
   照《分层累充-新累充》的排版语言
   =========================================================================== */
.board { position: relative; background: var(--board-bg); }

.board-title { display: flex; align-items: center; gap: 26px; }
.board-title .bar { width: 44px; height: 76px; background: var(--note); }
.board-title .txt { font-size: 76px; font-weight: 900; color: #fff; }

.sec { font-size: 50px; font-weight: 700; color: #fff; }      /* （1）策划需求 */
.cap { font-size: 34px; font-weight: 700; color: #fff; }      /* 每张界面上方的白标题 */

/* 标注：白色粗体标题 + 青色说明行 */
.note-t  { font-size: 30px; font-weight: 700; color: var(--note-t); }
.note-d  { font-size: 28px; color: var(--note); line-height: 1.5; }
.note-d.r{ text-align: right; }

/* 引线：青色细线 + 箭头 */
.ln  { background: var(--note); height: 3px; }
.ln.v{ width: 3px; height: auto; }
.ar  { width: 0; height: 0; border-top: 11px solid transparent; border-bottom: 11px solid transparent; }
.ar.l{ border-right: 18px solid var(--note); }
.ar.r{ border-left: 18px solid var(--note); }

/* 状态序列块：浅灰圆角底 + 蓝色粗箭头 */
.seq     { background: #2E2E2E; border-radius: 18px; }
.seq-cap { font-size: 32px; font-weight: 700; color: #fff; }
.bigar   { width: 0; height: 0; border-top: 26px solid transparent;
           border-bottom: 26px solid transparent; border-left: 46px solid var(--cyan); }

  // ── 顶部发射口 ×5 ──
  function launchers(s, g) {
    const n = 5, w = 118, gap = (g.bw - n * w) / (n + 1);
    let h = '';
    for (let i = 0; i < n; i++) {
      const x = g.bx + gap + i * (w + gap);
      const off = s.flying;
      h += `<div class="abs" style="left:${x}px;top:${g.by - 92}px;width:${w}px;height:104px" ${L('发射口' + (i + 1) + (off ? ' 置灰' : ''))}>
        <div class="abs" style="left:14px;top:0;width:90px;height:62px;border-radius:50%;background:${off ? 'linear-gradient(180deg,#5C7C99,#33506B)' : 'linear-gradient(180deg,#FFD24A,#E08A0C)'};border:4px solid ${off ? '#22364A' : '#7A4A06'}"></div>
        ${off ? '' : `<div class="abs" style="left:44px;top:18px;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:20px solid #7A4A06"></div>`}
        <div class="abs" style="left:28px;top:52px;width:62px;height:50px;background:#C9A882;border:4px solid #7A5A34;border-radius:6px 6px 14px 14px"></div></div>`;
    }
    return h;
  }

  // ── 盘顶提示条 / 实时读数（弹弹乐把它复用成 HUD） ──
  function hintBar(s, g) {
    const live = s.hits > 0 || s.flying;
    const inner = live
      ? `<div class="abs" style="left:0;top:0;width:${g.bw}px;height:52px;display:flex;align-items:center;justify-content:center;gap:14px">
           <div class="t sm" style="font-size:28px">撞击</div>
           <div class="t ${s.burst ? 'gold' : 'cyan'}" style="font-size:36px">${s.hits} / 11</div>
           <div class="t sm" style="font-size:28px;color:#8A929B">·</div>
           <div class="t sm" style="font-size:28px">本发累计</div>
           <div class="t gold" style="font-size:36px">${s.acc.toLocaleString()}</div></div>`
      : `<div class="t dark abs" style="left:0;top:6px;width:${g.bw}px;text-align:center;font-size:30px">点击任意洞口发射弹珠</div>`;
    return `<div class="abs" style="left:${g.bx}px;top:${g.by + 14}px;width:${g.bw}px;height:52px;background:${live ? 'rgba(10,14,26,.82)' : 'linear-gradient(180deg,#FFD98A,#E0A83C)'};border-radius:8px" ${L(live ? '实时读数条' : '操作提示条')}>${live ? '' : ''}${inner}</div>`;
  }

  // ── 盘面：钉阵 + 撞柱 + 弹珠 + 拖尾 + 飘字 ──
  function plinko(s, g) {
    const ROWS = 8, PAD = 70, IY = 90, IH = g.bh - 210;
    let h = '';
    const POSTS = { '1-3': 3, '3-1': 5, '3-5': 5, '5-2': 8, '5-4': 8 };
    for (let r = 0; r < ROWS; r++) {
      const n = r % 2 === 0 ? 7 : 6;
      const y = IY + r * (IH / (ROWS - 1));
      const gap = (g.bw - PAD * 2) / (n - 1 + (r % 2 === 0 ? 0 : 1));
      for (let c = 0; c < n; c++) {
        const x = PAD + c * gap + (r % 2 ? gap / 2 : 0);
        const num = POSTS[r + '-' + c];
        if (num) {
          const dead = s.dead;
          h += `<div class="abs" style="left:${x - 34}px;top:${y - 34}px;width:68px;height:68px;border-radius:50%;background:${dead ? '#3B4250' : 'linear-gradient(160deg,#6FD8F0,#2A6E9C)'};border:4px solid ${dead ? '#2A303C' : '#123A55'};display:flex;align-items:center;justify-content:center" ${L('撞柱-' + num + '分' + (dead ? ' 熄灭' : ''))}>
            <div class="t ${dead ? '' : 'gold'} sm" style="font-size:26px;${dead ? 'color:#5A6272' : ''}">${num}</div></div>`;
        } else {
          h += `<div class="abs" style="left:${x - 11}px;top:${y - 11}px;width:22px;height:22px;border-radius:50%;background:#C9A882;box-shadow:0 3px 0 #8A6A44"></div>`;
        }
      }
    }
    const trail = (s.trail || []).map((p, i) =>
      `<div class="abs" style="left:${p[0] - 9}px;top:${p[1] - 9}px;width:18px;height:18px;border-radius:50%;background:${s.advSel ? '#FFC600' : '#EAF2FF'};opacity:${0.15 + i * 0.14}"></div>`).join('');
    const ball = s.ball
      ? `<div class="abs" style="left:${s.ball[0] - 21}px;top:${s.ball[1] - 21}px;width:42px;height:42px;border-radius:50%;background:${s.advSel ? '#FFC600' : '#EAF2FF'};box-shadow:0 0 26px 8px ${s.advSel ? 'rgba(255,198,0,.8)' : 'rgba(160,210,255,.65)'}" ${L('弹珠')}></div>` : '';
    const pop = s.pop
      ? `<div class="t green abs" style="left:${s.pop[0]}px;top:${s.pop[1]}px;font-size:44px" ${L('命中飘字')}>+${s.pop[2]}</div>` : '';
    const burst = s.burst
      ? `<div class="abs" style="left:${g.bw / 2 - 260}px;top:${g.bh / 2 - 110}px;width:520px;height:190px;border:5px solid #FFC600;border-radius:18px;background:rgba(255,198,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center" ${L('第11次翻倍演出')}>
           <div class="t gold" style="font-size:66px">累计 ×2</div>
           <div class="t sm" style="font-size:26px;color:#FFE9A8">第 11 次撞击 · 翻倍并封顶</div></div>` : '';

    return `<div class="abs" style="left:${g.bx}px;top:${g.by}px;width:${g.bw}px;height:${g.bh}px" ${L('弹珠盘')}>
      <div class="slot abs" style="left:0;top:0;width:${g.bw}px;height:${g.bh}px" data-slot="盘面木框与背板"></div>
      <div class="abs" style="left:0;top:0;width:${g.bw}px;height:${g.bh}px" ${L('钉阵与撞柱')}>${h}</div>
      ${trail}${ball}${pop}${burst}</div>`;
  }

<script>
/* ===========================================================================
   svgbake.js —— 把 .canvas 的 DOM 布局结果「烘焙」成分组命名的 SVG
   目的：HTML 负责排版（flex 好用），SVG 负责交付（Figma 拖进去自动成图层树）

   规则：
     [data-layer]  → <g id="名字">，容器嵌套，图层名 = 属性值
     [data-slot]   → 美术槽位，出一个命名好的空框（后续贴 AI 图）
     [data-note]   → 标注，统一收进最外层 <g id="标注层">，Figma 里一键隐藏

   烘焙结果写进 <script type="text/plain" id="__svg__">，供 render_ux.py 用
   Chrome --dump-dom 取走。
   =========================================================================== */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  let origin = { x: 0, y: 0 };
  const defs = [];
  let gradSeq = 0;

  const esc = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

  const n = (v) => Math.round(v * 100) / 100;

  // —— 颜色：rgba(…) → {hex, opacity}；透明返回 null ——
  function color(css) {
    if (!css) return null;
    const m = css.match(/rgba?\(([^)]+)\)/);
    if (!m) return null;
    const p = m[1].split(',').map((x) => parseFloat(x.trim()));
    const a = p.length > 3 ? p[3] : 1;
    if (a === 0) return null;
    const hex = '#' + p.slice(0, 3)
      .map((c) => Math.round(c).toString(16).padStart(2, '0')).join('');
    return { hex, opacity: a };
  }

  // —— linear-gradient(180deg, #A 0%, #B 100%) → <linearGradient> ——
  function gradient(bgImage) {
    if (!bgImage || bgImage.indexOf('linear-gradient') < 0) return null;
    if (bgImage.indexOf('repeating-linear-gradient') === 0) return null; // 斜纹底：走纯色回落
    // ⛔ radial-gradient 不支持 —— 用了会烘焙成「无填充」，元素变空心。
    //    kit 里一律用 linear-gradient 代替，别图省事写 radial。
    const inner = bgImage.slice(bgImage.indexOf('(') + 1, bgImage.lastIndexOf(')'));
    const parts = inner.split(/,(?![^(]*\))/).map((s) => s.trim());
    let deg = 180;
    if (/^-?[\d.]+deg$/.test(parts[0])) deg = parseFloat(parts.shift());
    else if (/^to /.test(parts[0])) { const d = parts.shift(); deg = /right/.test(d) ? 90 : 180; }
    const stops = [];
    parts.forEach((p, i) => {
      const c = color(p);
      if (!c) return;
      const pm = p.match(/([\d.]+)%\s*$/);
      const off = pm ? parseFloat(pm[1]) : (i / Math.max(1, parts.length - 1)) * 100;
      stops.push({ c, off });
    });
    if (stops.length < 2) return null;
    // deg: 0=向上, 90=向右, 180=向下（CSS 定义）
    const rad = (deg - 90) * Math.PI / 180;
    const x1 = n(50 - Math.cos(rad) * 50), y1 = n(50 - Math.sin(rad) * 50);
    const x2 = n(50 + Math.cos(rad) * 50), y2 = n(50 + Math.sin(rad) * 50);
    const id = 'g' + (++gradSeq);
    defs.push(
      `<linearGradient id="${id}" x1="${x1}%" y1="${y1}%" x2="${x2}%" y2="${y2}%">` +
      stops.map((s) => `<stop offset="${n(s.off)}%" stop-color="${s.c.hex}" stop-opacity="${s.c.opacity}"/>`).join('') +
      `</linearGradient>`
    );
    return `url(#${id})`;
  }

  function rectOf(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left - origin.x, y: r.top - origin.y, w: r.width, h: r.height };
  }

  function radius(cs, r) {
    const v = cs.borderTopLeftRadius || '0px';
    if (v.indexOf('%') >= 0) return Math.min(r.w, r.h) / 2;
    return parseFloat(v) || 0;
  }

  // —— 元素自身的底板：背景 + 描边 ——
  function boxOf(el, cs, r) {
    const out = [];
    const rx = n(radius(cs, r));
    const grad = gradient(cs.backgroundImage);
    const bg = color(cs.backgroundColor);
    const fill = grad || (bg ? bg.hex : null);
    const fillOp = grad ? 1 : (bg ? bg.opacity : 0);

    const bw = parseFloat(cs.borderTopWidth) || 0;
    const bc = color(cs.borderTopColor);
    const dashed = cs.borderTopStyle === 'dashed';

    if (fill) {
      out.push(`<rect x="${n(r.x)}" y="${n(r.y)}" width="${n(r.w)}" height="${n(r.h)}"` +
        (rx ? ` rx="${rx}"` : '') + ` fill="${fill}"` +
        (fillOp < 1 ? ` fill-opacity="${n(fillOp)}"` : '') + `/>`);
    }
    if (bw > 0 && bc) {
      const i = bw / 2;
      out.push(`<rect x="${n(r.x + i)}" y="${n(r.y + i)}" width="${n(Math.max(0, r.w - bw))}"` +
        ` height="${n(Math.max(0, r.h - bw))}"` + (rx ? ` rx="${n(Math.max(0, rx - i))}"` : '') +
        ` fill="none" stroke="${bc.hex}" stroke-width="${n(bw)}"` +
        (bc.opacity < 1 ? ` stroke-opacity="${n(bc.opacity)}"` : '') +
        (dashed ? ` stroke-dasharray="5 4"` : '') + `/>`);
    }
    return out;
  }

  // —— 文字：用 Range 逐行量，位置与 Chrome 排版一致 ——
  function lineBoxes(node) {
    const s = node.textContent;
    const a = s.search(/\S/), b = s.search(/\s*$/);
    if (a < 0) return [];
    const rg = document.createRange();
    const out = [];
    let start = a;
    for (let i = a + 1; i <= b; i++) {
      rg.setStart(node, start); rg.setEnd(node, i);
      if (rg.getClientRects().length > 1) {
        rg.setStart(node, start); rg.setEnd(node, i - 1);
        out.push({ text: s.slice(start, i - 1), r: rg.getBoundingClientRect() });
        start = i - 1;
        while (start < b && /\s/.test(s[start])) start++;
      }
    }
    rg.setStart(node, start); rg.setEnd(node, b);
    out.push({ text: s.slice(start, b), r: rg.getBoundingClientRect() });
    return out.filter((o) => o.text.trim());
  }

  function textOf(el, cs) {
    const out = [];
    const fill = color(cs.color);
    if (!fill) return out;
    const fs = parseFloat(cs.fontSize) || 13;
    const fw = cs.fontWeight;
    const fam = 'PingFang SC, Noto Sans SC, sans-serif';
    for (const node of el.childNodes) {
      if (node.nodeType !== 3 || !node.textContent.trim()) continue;
      for (const ln of lineBoxes(node)) {
        const x = ln.r.left - origin.x;
        const y = ln.r.top - origin.y + ln.r.height * 0.765;   // 近似基线：实测对齐 Chrome 排版，别乱调
        const sw = parseFloat(cs.webkitTextStrokeWidth) || 0;
        const sc = sw > 0 ? color(cs.webkitTextStrokeColor) : null;
        out.push(`<text x="${n(x)}" y="${n(y)}" font-family="${fam}" font-size="${n(fs)}"` +
          (fw && fw !== '400' ? ` font-weight="${fw}"` : '') +
          ` fill="${fill.hex}"` + (fill.opacity < 1 ? ` fill-opacity="${n(fill.opacity)}"` : '') +
          (sc ? ` stroke="${sc.hex}" stroke-width="${n(sw * 2)}" paint-order="stroke"` +
                ` stroke-linejoin="round"` : '') +
          ` xml:space="preserve">${esc(ln.text.trim())}</text>`);
      }
    }
    return out;
  }

  // 图片转 data URI —— SVG 必须自包含，Figma 解析不了外链
  const uriCache = new Map();
  function dataURI(img) {
    const key = img.currentSrc || img.src;
    if (uriCache.has(key)) return uriCache.get(key);
    let out = key;
    try {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      out = c.toDataURL('image/png');
    } catch (e) { /* 取不到就退回原始 src，至少 PNG 那一路还是对的 */ }
    uriCache.set(key, out);
    return out;
  }

  function imgOf(el, r) {
    if (el.tagName !== 'IMG' || !el.naturalWidth) return [];
    const fit = getComputedStyle(el).objectFit === 'fill' ? 'none' : 'xMidYMid meet';
    return [`<image x="${n(r.x)}" y="${n(r.y)}" width="${n(r.w)}" height="${n(r.h)}"` +
      ` preserveAspectRatio="${fit}" href="${dataURI(el)}"/>`];
  }

  const isNoteRoot = (el) =>
    el.hasAttribute('data-note') &&
    !(el.parentElement && el.parentElement.closest('[data-note]'));

  // —— 主遍历 ——
  function walk(el, skipNotes) {
    if (el.nodeType !== 1) return '';
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden') return '';
    if (skipNotes && isNoteRoot(el)) return '';

    const r = rectOf(el);
    const body = [];
    if (r.w > 0 && r.h > 0) body.push(...boxOf(el, cs, r), ...imgOf(el, r));
    body.push(...textOf(el, cs));
    for (const kid of el.children) body.push(walk(kid, skipNotes));

    const inner = body.filter(Boolean).join('');
    if (!inner) return '';

    const name = el.getAttribute('data-layer') || el.getAttribute('data-slot');
    if (!name) return inner;
    const op = parseFloat(cs.opacity);
    return `<g id="${esc(name)}" data-name="${esc(name)}"` +
      (op < 1 ? ` opacity="${n(op)}"` : '') + `>${inner}</g>`;
  }

  function bake() {
    const canvas = document.querySelector('.canvas');
    const cr = canvas.getBoundingClientRect();
    origin = { x: cr.left, y: cr.top };
    const W = Math.round(cr.width), H = Math.round(cr.height);

    const main = walk(canvas, true);
    const notes = [...canvas.querySelectorAll('[data-note]')]
      .filter(isNoteRoot).map((el) => walk(el, false)).filter(Boolean).join('');

    const bg = color(getComputedStyle(canvas).backgroundColor);
    return `<svg xmlns="${NS}" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">` +
      (defs.length ? `<defs>${defs.join('')}</defs>` : '') +
      (bg ? `<rect width="${W}" height="${H}" fill="${bg.hex}"/>` : '') +
      main +
      (notes ? `<g id="标注层" data-name="标注层">${notes}</g>` : '') +
      `</svg>`;
  }

  function run() {
    const svg = bake();
    let holder = document.getElementById('__svg__');
    if (!holder) {
      holder = document.createElement('script');
      holder.type = 'text/plain'; holder.id = '__svg__';
      document.body.appendChild(holder);
    }
    holder.textContent = svg;
    // 上报每一屏的实测尺寸 —— 规范要求「出图后必须校验像素」，交给 render_ux.py 断言
    holder.setAttribute('data-screens', [...document.querySelectorAll('.screen')]
      .map((e) => { const r = e.getBoundingClientRect();
                    return Math.round(r.width) + 'x' + Math.round(r.height); }).join(','));
    document.documentElement.setAttribute('data-baked', '1');
  }

  if (document.readyState === 'complete') run();
  else window.addEventListener('load', () => setTimeout(run, 60));
})();

</script>

<style>
  #__vp { position: relative; }
  #__bar { position: fixed; right: 16px; top: 16px; z-index: 99999; display: flex; gap: 6px;
    align-items: center; background: rgba(18,22,30,.94); border: 1px solid #3A4658;
    border-radius: 10px; padding: 7px 11px; box-shadow: 0 8px 28px rgba(0,0,0,.6);
    font: 13px/1 -apple-system, "PingFang SC", sans-serif; color: #E8EDF3; }
  #__bar button { background: #232B36; border: 1px solid #3A4658; color: #E8EDF3;
    border-radius: 6px; padding: 6px 10px; font: 600 13px/1 inherit; cursor: pointer; }
  #__bar button:hover { background: #2F3A49; }
  #__bar .pct { min-width: 48px; text-align: center; color: #7FE7F0;
    font-variant-numeric: tabular-nums; }
  #__bar .sep { width: 1px; height: 18px; background: #3A4658; }
</style>
<div id="__bar">
  <button id="__out">&minus;</button><span class="pct" id="__pct">100%</span><button id="__in">+</button>
  <span class="sep"></span>
  <button id="__fw">适应宽度</button><button id="__fh">整板</button><button id="__11">100%</button>
</div>
<script>
(function () {
  var b = document.querySelector('.canvas') || document.body.firstElementChild;
  var W = b.offsetWidth, H = b.offsetHeight;
  var vp = document.createElement('div'); vp.id = '__vp';
  b.parentNode.insertBefore(vp, b); vp.appendChild(b);
  b.style.transformOrigin = '0 0';
  var k = 1;
  function apply(n) {
    k = Math.min(2, Math.max(0.03, n));
    b.style.transform = 'scale(' + k + ')';
    vp.style.width = (W * k) + 'px'; vp.style.height = (H * k) + 'px';
    document.getElementById('__pct').textContent = Math.round(k * 100) + '%';
  }
  var fw = function () { apply((innerWidth - 36) / W); };
  var fh = function () { apply(Math.min((innerWidth - 36) / W, (innerHeight - 36) / H)); };
  document.getElementById('__in').onclick  = function () { apply(k * 1.25); };
  document.getElementById('__out').onclick = function () { apply(k / 1.25); };
  document.getElementById('__fw').onclick  = fw;
  document.getElementById('__fh').onclick  = fh;
  document.getElementById('__11').onclick  = function () { apply(1); };
  addEventListener('keydown', function (e) {
    if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === '=' || e.key === '+') { e.preventDefault(); apply(k * 1.25); }
    if (e.key === '-') { e.preventDefault(); apply(k / 1.25); }
    if (e.key === '0') { e.preventDefault(); fw(); }
  });
  // 按住空格拖动平移
  var pan = false, sx, sy, ox, oy;
  addEventListener('mousedown', function (e) {
    if (e.target.closest('#__bar')) return;
    pan = true; sx = e.clientX; sy = e.clientY; ox = scrollX; oy = scrollY;
    document.body.style.cursor = 'grabbing';
  });
  addEventListener('mousemove', function (e) {
    if (pan) scrollTo(ox - (e.clientX - sx), oy - (e.clientY - sy));
  });
  addEventListener('mouseup', function () { pan = false; document.body.style.cursor = ''; });
  fw();
})();
</script>

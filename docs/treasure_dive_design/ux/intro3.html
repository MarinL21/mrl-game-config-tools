<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>深海探宝 · 活动开始介绍流程（三联）</title>
<link rel="stylesheet" href="p2ux19.css">
<style>
/* ===========================================================================
   深海探宝 · 开局介绍三联图
   甲式黑底流程板，横排 3 张 1920×1080 单屏，每屏都是活的（可点）
   =========================================================================== */
:root{
  --sea-1:#0B2138; --sea-2:#071726; --sea-line:#2A6E8E;
  --sea-cyan:#4FE3F5; --sea-gold:#FFC94A; --sea-ink:#CBE6F2;
}
body{background:#0D0D0D;}
.canvas{position:relative;width:6220px;height:1940px;background:#0D0D0D;
        font-family:"PingFang SC","Noto Sans SC",sans-serif;}

/* —— 板头 —— */
.bd-title{position:absolute;left:90px;top:52px;display:flex;align-items:center;gap:26px;}
.bd-title .bar{width:44px;height:76px;background:var(--note);}
.bd-title .txt{font-size:72px;font-weight:900;color:#fff;}
.bd-sub{position:absolute;left:160px;top:146px;font-size:30px;color:#8FA6B4;line-height:1.6;}
.bd-sub b{color:#fff;font-weight:700;}
.bd-meta{position:absolute;right:90px;top:58px;text-align:right;font-size:28px;color:#8FA6B4;line-height:1.75;}
.bd-meta b{color:var(--note);font-weight:700;}

.scr-cap{position:absolute;font-size:38px;font-weight:900;color:#fff;}
.scr-cap span{font-size:26px;font-weight:400;color:#8FA6B4;margin-left:16px;}
.flowar{position:absolute;width:0;height:0;border-top:30px solid transparent;
        border-bottom:30px solid transparent;border-left:52px solid var(--cyan);}

/* —— 标注块（甲式：白标题 + 青说明） —— */
.note{position:absolute;width:1920px;}
.note h4{font-size:32px;font-weight:900;color:#fff;margin-bottom:16px;}
.note ul{list-style:none;}
.note li{font-size:26px;color:var(--note);line-height:1.66;padding-left:28px;position:relative;}
.note li::before{content:"·";position:absolute;left:8px;color:var(--note);}
.note li b{color:#fff;font-weight:700;}
.note li em{color:#FF8A5B;font-style:normal;font-weight:700;}
.note .cfg{color:#7E93A2;}

/* ===========================================================================
   单屏内部
   =========================================================================== */
.screen{position:absolute;overflow:hidden;}
.bgscene{position:absolute;left:-189px;top:0;width:2298px;height:1080px;}
.dim{position:absolute;left:0;top:0;width:1920px;height:1080px;
     background:radial-gradient(120% 100% at 50% 40%,rgba(2,18,34,.46),rgba(1,10,20,.84));}
.navbar{position:absolute;left:0;top:0;width:369px;height:1080px;}

.pop{position:absolute;left:189px;top:26px;width:1542px;height:1027px;}
.pop-base{position:absolute;left:0;top:0;}
.pop-bar{position:absolute;left:7px;top:8px;}
.pop-title{position:absolute;left:0;top:28px;width:1542px;text-align:center;
           font-size:52px;font-weight:900;color:#3A3A3A;}
.pop-page{position:absolute;right:130px;top:38px;font-size:34px;font-weight:700;color:#6E6E6E;}
.pop-x{position:absolute;left:1465px;top:-20px;width:122px;height:115px;cursor:pointer;}

/* 内容井 */
.well{position:absolute;left:40px;top:142px;width:1462px;height:740px;
      background:linear-gradient(180deg,var(--sea-1),var(--sea-2));
      border:3px solid var(--sea-line);border-radius:14px;overflow:hidden;}
.well::after{content:"";position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(80% 60% at 50% 0%,rgba(79,227,245,.10),transparent 70%);}
.well-h{position:absolute;left:30px;top:20px;font-size:42px;font-weight:900;color:var(--sea-gold);
        -webkit-text-stroke:4px #12293D;paint-order:stroke fill;white-space:nowrap;}
.well-h small{font-size:25px;font-weight:400;color:var(--sea-ink);
              -webkit-text-stroke-width:0;margin-left:18px;}
.rule-line{position:absolute;left:30px;top:84px;width:1402px;height:2px;
           background:linear-gradient(90deg,rgba(79,227,245,.75),rgba(79,227,245,0));}

/* 底部页脚 */
.foot{position:absolute;left:0;top:886px;width:1542px;height:141px;}
.dots{position:absolute;left:0;top:48px;width:1542px;display:flex;justify-content:center;gap:20px;}
.dot{width:22px;height:22px;border-radius:50%;background:#8B8892;border:2px solid #3B3942;cursor:pointer;}
.dot.on{background:var(--sea-cyan);border-color:#0E3A4A;box-shadow:0 0 12px rgba(79,227,245,.9);}
.btn{position:absolute;cursor:pointer;}
.btn img{display:block;}
.btn .lbl{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;
          justify-content:center;font-size:42px;font-weight:900;}
.btn.blue .lbl{color:#08323C;}
.btn.gold .lbl{color:#4A2E00;}
.btn.gray .lbl{color:#5A5A5A;}
.foot-hint{position:absolute;left:412px;top:88px;display:flex;align-items:center;gap:12px;
           font-size:24px;color:#3E3B44;}
.foot-hint img{width:40px;height:40px;}

/* —— 盘面 —— */
.board{position:absolute;border-radius:14px;background:#0A2C3E;
       box-shadow:0 0 0 3px #2A6E8E inset;}
.board-in{position:absolute;display:grid;}
.cell{position:relative;background:#123A5C;border-radius:6px;overflow:hidden;}
.cell img{width:100%;height:100%;}
.cell.pick{outline:4px solid var(--sea-gold);outline-offset:-4px;cursor:pointer;}
.cell.pick::after{content:"";position:absolute;inset:0;background:rgba(255,201,74,.14);}
.cell.nogo{opacity:.38;box-shadow:inset 0 0 0 3px rgba(255,255,255,.30);border-radius:6px;}
.cell.dug{outline:4px solid #5FE3F5;outline-offset:-4px;}
.cell.dug::after{content:"";position:absolute;inset:0;background:rgba(95,227,245,.20);}
.cell.bad{outline:4px solid #FF4D4D;outline-offset:-4px;}
.cell.bad::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(255,77,77,.22);}
.cell.hot{outline:4px solid #FF6B4A;outline-offset:-4px;}
.cell.hot::after{content:"";position:absolute;inset:0;background:rgba(255,107,74,.24);}
.cell .num{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;
           justify-content:center;font-size:32px;font-weight:900;color:#fff;
           -webkit-text-stroke:4px #0C2438;paint-order:stroke fill;}
.cell .qty{position:absolute;right:3px;bottom:1px;font-size:21px;font-weight:900;color:#fff;
           -webkit-text-stroke:3px #0C2438;paint-order:stroke fill;}
.board-lbl{position:absolute;font-size:23px;color:#7FB9CE;}
.board-lbl b{color:var(--sea-gold);}

.chip{position:absolute;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 8px;
      background:rgba(4,24,42,.86);border:2px solid #2F6C8C;border-radius:30px;}
.chip img{width:44px;height:44px;}
.chip .v{font-size:32px;font-weight:900;color:#fff;-webkit-text-stroke:3px #0C2438;paint-order:stroke fill;}
.chip .k{font-size:23px;color:#8FC6DA;}

/* 规则条目 */
.rules{position:absolute;}
.ri{position:relative;height:84px;margin-bottom:6px;padding-left:72px;}
.ri .n{position:absolute;left:0;top:6px;width:50px;height:50px;border-radius:50%;
       background:linear-gradient(180deg,#3FD0E8,#1B7EA0);border:3px solid #0C3348;
       display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;color:#04222E;}
.ri h5{font-size:32px;font-weight:900;color:#fff;-webkit-text-stroke:3px #0E2A3E;paint-order:stroke fill;}
.ri p{font-size:26px;color:var(--sea-ink);line-height:1.4;margin-top:4px;}
.ri p b{color:var(--sea-gold);font-weight:700;}
.ri p i{color:#FF9A6B;font-style:normal;font-weight:700;}

/* 卡片：道具（竖排大卡） */
.card{position:absolute;background:rgba(6,32,56,.9);border:3px solid #245F7D;border-radius:14px;
      cursor:pointer;}
.card.on{border-color:var(--sea-cyan);background:rgba(12,52,80,.96);
         box-shadow:0 0 0 3px rgba(79,227,245,.35) inset;}
.card .ic{position:absolute;border-radius:10px;background:#0E3550;border:2px solid #2E7392;overflow:hidden;}
.card .ic img{width:100%;height:100%;}
.card.tool .ic{left:16px;top:16px;width:104px;height:104px;}
.card.tool h5{position:absolute;left:138px;top:20px;font-size:36px;font-weight:900;color:#fff;
              -webkit-text-stroke:3px #0E2A3E;paint-order:stroke fill;}
.card.tool .cost{position:absolute;left:138px;top:70px;width:396px;font-size:24px;
                 color:var(--sea-gold);line-height:1.35;}
.card.tool .pin{position:absolute;right:14px;bottom:10px;font-size:21px;color:#5F8EA4;}
.card.on.tool .pin{color:var(--sea-cyan);}
/* 卡片：格子（横排小卡） */
.card.kind .ic{left:12px;top:12px;width:66px;height:66px;}
.card.kind h6{position:absolute;left:90px;top:12px;font-size:26px;font-weight:900;color:#fff;}
.card.kind p{position:absolute;left:90px;top:44px;width:172px;font-size:20px;color:#9FC7D8;line-height:1.35;}

.side{position:absolute;background:rgba(4,24,42,.82);border:2px dashed #2F6C8C;border-radius:12px;}
.side h6{font-size:29px;font-weight:900;color:var(--sea-cyan);margin:16px 0 10px 20px;line-height:1.25;}
.side ul{list-style:none;margin:0 20px;}
.side li{font-size:23px;color:var(--sea-ink);line-height:1.45;padding-left:20px;position:relative;
         margin-bottom:6px;}
.side li::before{content:"▪";position:absolute;left:0;color:#2F9CBC;}
.side .warn{margin:12px 20px 0;font-size:21px;color:#FF9A6B;line-height:1.4;}

/* 商店行 */
.shelf{position:absolute;}
.srow{position:relative;height:78px;margin-bottom:7px;background:rgba(6,32,56,.86);
      border:2px solid #245F7D;border-radius:10px;}
.srow .s{position:absolute;left:7px;top:7px;width:60px;height:60px;border-radius:8px;
         background:#0E3550;border:2px solid #2E7392;overflow:hidden;}
.srow .s img{width:100%;height:100%;}
.srow .nm{position:absolute;left:82px;top:9px;font-size:26px;font-weight:700;color:#fff;}
.srow .lm{position:absolute;left:82px;top:43px;font-size:21px;color:#7FA8BC;}
.srow .pr{position:absolute;right:10px;top:13px;display:flex;align-items:center;gap:8px;
          height:48px;padding:0 16px 0 6px;border-radius:24px;
          background:linear-gradient(180deg,#123C5C,#0A2740);border:2px solid #3D86A6;}
.srow .pr img{width:36px;height:36px;}
.srow .pr b{font-size:28px;font-weight:900;color:var(--sea-gold);}
.srow .pr.silver b{color:#DCEAF3;}

/* 深度轨 */
.rail{position:absolute;}
.tier{position:relative;height:52px;cursor:pointer;}
.tier .ln{position:absolute;left:19px;top:0;width:4px;height:52px;background:#245F7D;}
.tier .pt{position:absolute;left:8px;top:12px;width:26px;height:26px;border-radius:50%;
          background:#0E3550;border:4px solid #3D86A6;}
.tier.done .pt{background:#3EEE00;border-color:#1C6A00;}
.tier.now .pt{background:var(--sea-gold);border-color:#7A5100;box-shadow:0 0 14px rgba(255,201,74,.9);}
.tier .m{position:absolute;left:54px;top:8px;width:132px;font-size:29px;font-weight:900;color:#fff;
         -webkit-text-stroke:3px #0E2A3E;paint-order:stroke fill;}
.tier .m span{font-size:21px;}
.tier .sl{position:absolute;left:190px;top:3px;width:46px;height:46px;border-radius:6px;
          background:#0E3550;border:2px solid #2E7392;overflow:hidden;}
.tier .sl img{width:100%;height:100%;}
.tier .rw{position:absolute;left:246px;top:11px;font-size:24px;color:var(--sea-ink);}
.tier.now .rw{color:var(--sea-gold);font-weight:700;}
.tier .st{position:absolute;right:2px;top:12px;font-size:22px;font-weight:700;}
.tier.done .st{color:#3EEE00;}
.tier.now .st{color:var(--sea-gold);}
.tier.lock .st{color:#6E8A9A;}

.mark{position:absolute;font-size:22px;color:#7E93A2;line-height:1.45;}
.mark b{color:var(--sea-gold);}
.float{position:absolute;font-size:29px;font-weight:900;color:#7CFF5B;white-space:nowrap;
       -webkit-text-stroke:4px #0C2438;paint-order:stroke fill;pointer-events:none;
       animation:fl 1s ease-out forwards;}
@keyframes fl{0%{opacity:0;transform:translateY(6px) scale(.86)}
              18%{opacity:1;transform:translateY(-6px) scale(1.06)}
              100%{opacity:0;transform:translateY(-56px) scale(1)}}
.toast{position:absolute;left:50%;transform:translateX(-50%);padding:10px 26px;border-radius:26px;
       background:rgba(120,18,18,.92);border:2px solid #FF6B4A;font-size:26px;font-weight:700;
       color:#FFD9CF;animation:tf 1.6s ease-out forwards;pointer-events:none;white-space:nowrap;}
@keyframes tf{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}

/* 操作条（不进单屏，只给评审用） */
#ctl{position:fixed;left:16px;bottom:16px;z-index:99998;display:flex;gap:8px;align-items:center;
     background:rgba(14,20,28,.95);border:1px solid #3A4658;border-radius:10px;padding:8px 12px;
     font:13px/1 "PingFang SC",sans-serif;color:#E8EDF3;}
#ctl button{background:#232B36;border:1px solid #3A4658;color:#E8EDF3;border-radius:6px;
            padding:6px 11px;font:600 13px/1 inherit;cursor:pointer;}
#ctl button:hover{background:#2F3A49;}
#ctl b{color:#7FE7F0;}

/* ===========================================================================
   ①页 · 黑底金标题「HOW TO PLAY」三联分镜版（2026-09-09 换版式，参考竞品 HTP 弹窗）
   整屏铺满 1920×1080，不套 P2 蓝弹窗底板
   =========================================================================== */
/* 纯色底：参考图就是近黑底，不铺游戏场景图（场景图右下自带斜纹会透出来） */
.htp-dim{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;
         background:#05080C;
         background-image:radial-gradient(78% 62% at 50% 34%,rgba(18,46,72,.55),rgba(4,8,13,0) 70%),
                          radial-gradient(120% 100% at 50% 100%,rgba(2,14,24,.9),rgba(0,0,0,0) 60%);}

/* 金色渐变标题条：中间亮、两端收深，白字深描边 */
.htp-bar{position:absolute;left:480px;top:30px;width:960px;height:86px;z-index:5;
         background:linear-gradient(180deg,#8A6A18 0%,#E8C255 18%,#FFF0B0 46%,#E2B845 62%,#7A5A12 100%);
         box-shadow:0 0 34px rgba(255,206,90,.34),inset 0 0 0 2px rgba(255,240,180,.55);
         display:flex;align-items:center;justify-content:center;
         clip-path:polygon(30px 0,930px 0,960px 43px,930px 86px,30px 86px,0 43px);}
.htp-bar span{font-size:50px;font-weight:900;letter-spacing:6px;color:#fff;
              -webkit-text-stroke:6px #4A3208;paint-order:stroke fill;}
.htp-x{position:absolute;left:1784px;top:34px;width:74px;height:74px;cursor:pointer;z-index:6;
       font-size:62px;font-weight:900;line-height:70px;text-align:center;color:#fff;
       text-shadow:0 3px 10px rgba(0,0,0,.85);}

/* 左右翻页圆钮 */
.htp-nav{position:absolute;top:452px;width:92px;height:92px;border-radius:50%;z-index:6;
         border:5px solid rgba(255,255,255,.86);color:#fff;font-size:56px;font-weight:400;
         line-height:82px;text-align:center;cursor:pointer;background:rgba(0,0,0,.30);}
.htp-nav.l{left:52px;}  .htp-nav.r{left:1776px;}
.htp-nav.off{opacity:.26;cursor:default;}

/* —— 三联分镜 —— */
.htp-col{position:absolute;width:460px;}
.htp-stage{position:relative;height:296px;}          /* 盘面示意区 */
.htp-cap{position:absolute;left:0;width:460px;top:304px;text-align:center;}
.htp-cap .ic{font-size:44px;line-height:52px;}
.htp-cap .tt{font-size:36px;font-weight:900;color:#F8B32B;letter-spacing:2px;
             -webkit-text-stroke:5px #2A1602;paint-order:stroke fill;margin-top:2px;}
.htp-desc{position:absolute;left:0;top:416px;width:460px;height:152px;padding:16px 22px;
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          background:rgba(0,0,0,.86);border:2px solid rgba(255,255,255,.16);border-radius:6px;
          font-size:23px;line-height:1.62;color:#E4EAF0;text-align:center;}
.htp-desc b{color:#FFD34F;font-weight:800;}
.htp-desc em{color:#FF8A5B;font-style:normal;font-weight:800;}

/* 两联之间的橙色弯箭头 */
.htp-ar{position:absolute;top:150px;width:100px;height:96px;}

/* —— 底部横贯消耗条 —— */
.htp-cost{position:absolute;left:170px;top:772px;width:1580px;height:158px;
          background:linear-gradient(180deg,rgba(28,20,4,.95),rgba(12,9,2,.95));
          border:2px solid rgba(248,179,43,.55);border-radius:8px;}
.htp-cost .hd{position:absolute;left:0;top:-19px;width:1580px;text-align:center;}
.htp-cost .hd span{background:#0A0A0A;padding:0 22px;font-size:26px;font-weight:800;color:#F8B32B;}
.htp-cost .row{position:absolute;left:0;top:34px;width:1580px;display:flex;
               align-items:center;justify-content:space-around;}
.htp-cost .it{display:flex;flex-direction:column;align-items:center;gap:6px;width:280px;}
.htp-cost .it .nm{font-size:22px;color:#C9D3DC;}
.htp-cost .it .vl{font-size:27px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;}
.htp-cost .it .vl.free{color:#6FE38A;}
.htp-cost .it .vl small{font-size:20px;font-weight:400;color:#9AA8B4;}

/* 分镜内的浮标 */
.htp-tag{position:absolute;font-size:24px;font-weight:900;padding:4px 12px;border-radius:5px;
         background:rgba(0,0,0,.8);border:2px solid rgba(255,255,255,.2);color:#fff;white-space:nowrap;}
.htp-tag.gold{color:#FFD34F;border-color:rgba(255,211,79,.5);}
.htp-tag.cyan{color:#5FE3F5;border-color:rgba(95,227,245,.5);}
.htp-hand{position:absolute;font-size:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.8));}
.htp-dots{position:absolute;left:0;top:988px;width:1920px;display:flex;justify-content:center;gap:20px;z-index:5;}
.htp-dots .dot{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;}
.htp-dots .dot.on{background:#F8B32B;}
.htp-well{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:3;}

/* ②页：道具示意用的叠加件 */
.htp-tool{position:absolute;filter:drop-shadow(0 4px 10px rgba(0,0,0,.9));}
.htp-no{position:absolute;width:76px;height:76px;}
.htp-legend{position:absolute;left:170px;top:842px;width:1580px;height:92px;
            background:rgba(0,0,0,.72);border:2px solid rgba(255,255,255,.14);border-radius:8px;
            display:flex;align-items:center;justify-content:center;gap:54px;
            font-size:24px;color:#C9D3DC;}
.htp-legend b{color:#FFD34F;font-weight:800;}
.htp-legend em{color:#FF8A5B;font-style:normal;font-weight:800;}
.htp-legend .sw{display:inline-block;width:26px;height:26px;border-radius:5px;vertical-align:-5px;margin-right:9px;}
.htp-legend .sw.hot{outline:3px solid #FF6B4A;background:rgba(255,107,74,.28);}
.htp-legend .sw.pick{outline:3px solid #FFC94A;background:rgba(255,201,74,.20);}

/* ③页：海螺来源 / 兑换商店 / 深度奖励 —— 沿用 htp 黑金体系 */
.htp-src{position:absolute;width:120px;text-align:center;}
.htp-src .lb{font-size:21px;font-weight:700;color:#E4EAF0;margin-top:8px;white-space:nowrap;}
.htp-src .lb small{display:block;font-size:18px;font-weight:400;color:#8B98A4;}
.htp-src .out{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px;}
.htp-rail{position:absolute;width:460px;}
.htp-rail .ln{position:absolute;left:120px;top:14px;bottom:14px;width:5px;height:auto;  /* ⛔ 不写 height:auto 会被 p2ux19.css 的 .ln{height:3px} 吃掉 */
              background:linear-gradient(180deg,#F8B32B,rgba(248,179,43,.25));}
.htp-rail .nd{position:relative;height:76px;}
.htp-rail .nd .pt{position:absolute;left:110px;top:24px;width:25px;height:25px;border-radius:50%;
                  background:#0A0A0A;border:5px solid rgba(248,179,43,.7);}

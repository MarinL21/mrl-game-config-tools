<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --ink:#1A1A1A; --gold:#FFC600; --cyan:#00CFEE; --green:#3EEE00; --org:#E8A020; --red:#FF5B41;
 --txt:#fff; --dim:#C8CDD4; --panel:#161013;
 /* 苗床几何（等距菱形精灵 252×151，含 6px 出血 + 13px 厚度）：作物落点 = 菱形中心略靠前；--k 作物缩放 */
 --plotW:282px; --plotH:163px; --cropBase:82px; --k:1;
}
html,body{height:100%;background:#000;overflow:hidden;
 font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
#fit{position:fixed;inset:0;overflow:hidden;background:#000}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;
 transform-origin:center center;overflow:hidden;background:#20211c}

/* P2 文字签名：粗黑体 + 深色描边 */
.t{font-weight:800;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;letter-spacing:.5px}
.t.md{-webkit-text-stroke-width:3px}
.t.sm{-webkit-text-stroke-width:2px}
.t.xs{-webkit-text-stroke-width:1.5px}
.t.g{color:var(--green)} .t.c{color:var(--cyan)} .t.y{color:var(--gold)} .t.o{color:var(--org)} .t.r{color:var(--red)}
.t.dark{color:#3A2A00;-webkit-text-stroke-width:0}

/* ── 盘面：全屏活动（B 型：盘面占满 + 四角挂件） ── */
#board{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 38%}
#board::after{content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(180deg,rgba(10,14,8,.30) 0%,rgba(10,14,8,0) 20%,rgba(10,14,8,0) 70%,rgba(12,10,6,.42) 100%)}
.lyr{position:absolute;z-index:5}
#title,#desc,#lvrow,#tip,#ops,#assets,#rank,#mile,#entries,#status,#ruleBtn{z-index:12}

/* ── 左上：标题 + 一句话说明 + 等级经验 + 提示条 ── */
#title{left:24px;top:14px;width:729px;height:104px;cursor:pointer}
#title img{width:100%;height:100%}
#title>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-size:38px;padding-bottom:6px}
#desc{left:44px;top:114px;font-size:17px;white-space:nowrap}
#lvrow{left:28px;top:146px;display:flex;align-items:center;gap:12px}
#lvbadge,.lvb{width:64px;height:64px;border-radius:12px;background:linear-gradient(180deg,#ffd34d,#e09a12);
 border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;
 box-shadow:0 3px 0 rgba(0,0,0,.35);flex:0 0 auto}
#lvbadge b,.lvb b{font-size:26px;color:#3A2A00} #lvbadge i,.lvb i{font-size:10px;font-style:normal;color:#6b4d05;font-weight:700}
#expwrap{position:relative;width:372px;height:44px}
#expclip{position:absolute;left:0;top:0;width:372px;height:44px;overflow:hidden;border-radius:22px;
 background:rgba(6,9,4,.82);border:4px solid var(--ink)}
#expfill{width:100%;height:100%;background:linear-gradient(180deg,#9df060,#3EEE00);
 transform-origin:left center;transform:scaleX(0);transition:transform .35s ease}
#exptxt{position:absolute;left:0;right:0;top:9px;text-align:center;font-size:20px}
#nextTxt{position:absolute;left:78px;top:48px;font-size:13px;white-space:nowrap;opacity:.95}
#tip{left:28px;top:226px;width:600px;height:73px}
#tip img{width:100%;height:100%}
#tip span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;padding:0 24px}

/* ── 右上：资产条 + 丰收榜入口 + 一键操作 ── */
#assets{right:20px;top:14px;display:flex;align-items:center;height:66px}
#assets .three{height:66px}
.chip{display:flex;align-items:center;height:66px;padding:0 16px 0 6px;margin-left:-6px;
 background:linear-gradient(180deg,#2b2b2b,#141414);border:3px solid #000;border-radius:33px;gap:6px}
.chip img{width:48px;height:48px}
.chip b{font-size:22px;font-weight:800;color:#fff;-webkit-text-stroke:2.5px #1A1A1A;paint-order:stroke fill;min-width:44px;text-align:center}
#plusbox{position:relative;width:52px;height:52px;margin-left:10px;cursor:pointer;
 border-radius:12px;background:linear-gradient(180deg,#6ff03a,#2aa312);border:3px solid var(--ink);
 display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;
 -webkit-text-stroke:3px #1A1A1A;paint-order:stroke fill;line-height:1;padding-bottom:4px}
#plusbox:hover{filter:brightness(1.12)}

#rank{right:26px;top:96px;height:70px;display:flex;align-items:center;gap:6px;padding:0 20px 0 4px;cursor:pointer;
 background:rgba(10,12,8,.74);border:3px solid var(--ink);border-radius:35px}
#rank:hover{background:rgba(30,32,20,.86)}
#rank img{width:66px;height:66px;object-fit:contain}
#rank .rt{display:flex;flex-direction:column;line-height:1.15}
#rank .rt span:first-child{font-size:19px}
#rank .rt span:last-child{font-size:14px;margin-top:2px}

#ops{right:26px;top:180px;display:flex;gap:10px}
.op{position:relative;width:196px;height:72px;cursor:pointer;border:0;background:none;padding:0;font-family:inherit;
 transition:transform .12s ease}
.op img{width:100%;height:100%;display:block}
.op span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 font-size:23px;line-height:1.1;padding-bottom:2px}
.op small{font-size:12px;font-weight:700;-webkit-text-stroke-width:1.2px;opacity:.95;margin-top:1px}
.op:disabled{cursor:not-allowed}
.op:not(:disabled):hover{transform:translateY(-2px)}
.op:not(:disabled):active{transform:translateY(1px) scale(.98)}
.op.n .cnt{position:absolute;right:-6px;top:-8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
 background:var(--red);border:2px solid #fff;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;
 justify-content:center;line-height:1}

/* ── 左：农会勋绩竖轨 ── */
#mile{left:28px;top:372px;width:150px;height:600px}
#mileTitle{position:absolute;left:0;top:-52px;width:170px;font-size:17px}
#mileCur{position:absolute;left:0;top:-30px;width:240px;font-size:13px;white-space:nowrap}
.mileTrack{position:absolute;left:6px;top:8px;width:26px;height:540px;border-radius:13px;
 background:rgba(8,10,6,.72);border:3px solid var(--ink);overflow:hidden}
.mileFill{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(180deg,#9df060,#2fae00);
 transition:height .4s ease}
.mileNode{position:absolute;left:42px;width:110px;height:52px;display:flex;align-items:center;gap:6px;cursor:pointer}
.mileNode .box{width:50px;height:50px;border-radius:11px;background:rgba(14,16,10,.85);position:relative;
 border:3px solid #5a5140;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mileNode.reach .box{border-color:var(--green);background:rgba(30,60,14,.9)}
.mileNode.got .box{border-color:var(--gold);background:rgba(70,52,8,.92)}
.mileNode.got .box::after{content:"✓";position:absolute;right:-7px;bottom:-7px;width:20px;height:20px;border-radius:50%;
 background:var(--gold);color:#3A2A00;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;
 border:2px solid var(--ink)}
.mileNode .box img{width:36px;height:36px;object-fit:contain}
.mileNode .lb{font-size:12px}

/* ── 田地 ── */
#field{left:0;top:0;width:1920px;height:1080px;z-index:6;pointer-events:none}
/* 地块头顶信息独立一层压在整片田地之上：贴在各自地块的近端下沿，不会被前排地块盖住 */
#hudLayer{left:0;top:0;width:1920px;height:1080px;z-index:8;pointer-events:none}
/* 田边的每日种子袋：可领时上下浮动 + 红点，领过后压灰写倒计时 */
#dailyBag{left:196px;top:772px;width:128px;cursor:pointer;z-index:7;text-align:center;transition:transform .15s}
#dailyBag:hover{transform:translateY(-3px)}
#dailyBag img{width:118px;display:block;margin:0 auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#dailyBag.can img{animation:bagbob 1.8s ease-in-out infinite}
#dailyBag.done img{filter:grayscale(.7) brightness(.75) drop-shadow(0 8px 10px rgba(0,0,0,.4))}
#dailyBag .bl{display:inline-block;margin-top:-6px;font-size:14px;background:rgba(10,12,8,.82);border:3px solid var(--gold);border-radius:14px;padding:3px 12px;white-space:nowrap}
#dailyBag.done .bl{border-color:var(--ink);color:#C8CDD4}
#dailyBag .rd{position:absolute;right:8px;top:2px;width:18px;height:18px;border-radius:50%;background:#ff3b30;border:2px solid var(--ink);display:none}
#dailyBag.can .rd{display:block}
@keyframes bagbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.bagres{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
.bagres .it{width:150px;background:#221b21;border:2px solid var(--gold);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.bagres .it img{height:80px}
.bagres .it b{font-size:15px;color:#fff}.bagres .it span{font-size:12px;color:var(--dim)}
.ground{position:absolute;z-index:1;pointer-events:none}
.hudp{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column-reverse;align-items:center;gap:4px;pointer-events:none}
.hudp>*{pointer-events:none}.hudp .boostb{pointer-events:auto}
.plot{position:absolute;width:var(--plotW);height:var(--plotH);cursor:pointer;pointer-events:auto}
.bed{position:absolute;left:0;bottom:0;width:100%;display:block;z-index:1;transition:filter .15s ease}
.plot:not(.locked):hover .bed{filter:brightness(1.08)}
.plot.locked:hover .bed{filter:brightness(1.15)}
/* 锁着的良田：看得见是金边水渠田，只是压灰 */
.plot.goldlock .bed{filter:brightness(.94)}
.plot.goldlock:hover .bed{filter:brightness(1.08)}
/* 作物立在苗床上表面中心 */
.cshadow{position:absolute;left:50%;bottom:calc(var(--cropBase) - 7px);width:calc(110px*var(--k));height:calc(24px*var(--k));margin-left:calc(-55px*var(--k));border-radius:50%;
 background:radial-gradient(ellipse,rgba(20,30,10,.42),transparent 70%);pointer-events:none;z-index:2}
.crop{position:absolute;left:50%;bottom:var(--cropBase);height:calc(156px*var(--k));transform:translateX(-50%);
 transform-origin:bottom center;pointer-events:none;z-index:3}
.plot.mature .crop{animation:sway 2.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(-50%) scale(var(--sc,1)) rotate(-1.2deg)}50%{transform:translateX(-50%) scale(var(--sc,1)) rotate(1.2deg)}}
/* 成熟：玻璃光泡罩住作物 */
.ripe{position:absolute;left:50%;bottom:calc(var(--cropBase) - 16px);width:calc(196px*var(--k));height:calc(186px*var(--k));margin-left:calc(-98px*var(--k));
 border-radius:50% 50% 46% 46% / 54% 54% 42% 42%;pointer-events:none;z-index:4;
 background:
  radial-gradient(ellipse at 34% 24%,rgba(255,255,255,.62),rgba(255,255,255,0) 26%),
  radial-gradient(ellipse at 50% 60%,rgba(226,255,206,.24),rgba(168,240,150,.12) 56%,rgba(120,210,110,.05) 78%,transparent 86%);
 box-shadow:inset 0 0 26px rgba(255,255,255,.3), inset 0 -14px 26px rgba(96,190,90,.22), 0 0 22px rgba(170,245,150,.3);
 animation:bre 2.6s ease-in-out infinite}
.ripe::before{content:"";position:absolute;left:14%;top:10%;width:26%;height:16%;border-radius:50%;
 background:rgba(255,255,255,.6);transform:rotate(-24deg)}
.ripe::after{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid rgba(255,255,255,.32)}
@keyframes bre{0%,100%{transform:scale(.96) translateY(1px);opacity:.86}50%{transform:scale(1.03) translateY(-2px);opacity:1}}
.spark{position:absolute;width:12px;height:12px;pointer-events:none;z-index:5;
 background:radial-gradient(circle,#fff 0 18%,rgba(255,255,255,.55) 34%,transparent 62%);animation:twk 1.8s ease-in-out infinite}
.spark.s1{left:24%;bottom:calc(var(--cropBase) + 120px);animation-delay:.1s}
.spark.s2{right:22%;bottom:calc(var(--cropBase) + 84px);animation-delay:.7s}
.spark.s3{left:50%;bottom:calc(var(--cropBase) + 160px);animation-delay:1.25s}
@keyframes twk{0%,100%{opacity:0;transform:scale(.5)}45%{opacity:1;transform:scale(1.15)}}
/* 地块头顶信息（计时 / 收获 / 浇水点 / 速生剂）——按作物阶段高度挂在作物顶上 */
.hud{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;z-index:7;pointer-events:none}
.hud>*{pointer-events:auto}
.hrow{display:flex;align-items:center;gap:6px}
.pill{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px;height:30px;border-radius:15px;white-space:nowrap;
 background:rgba(18,14,10,.82);border:3px solid var(--ink);font-size:14px;overflow:hidden}
.pill .pf{position:absolute;left:0;top:0;bottom:0;background:rgba(0,207,238,.28);transform-origin:left center;z-index:0}
.pill>*{position:relative;z-index:1}
.pill .ck{width:14px;height:14px;border-radius:50%;border:2px solid #dfe;position:relative;display:inline-block}
.pill .ck::after{content:"";position:absolute;left:4px;top:1px;width:2px;height:5px;background:#dfe;transform-origin:bottom;transform:rotate(0)}
.pill.ok{background:linear-gradient(180deg,#5ea34b,#2f7a22);border-color:#173d10}
.pill.dry{background:linear-gradient(180deg,#8f3a2c,#6a2418);border-color:#3a120b}
.pill.ok .t{color:#fff}
.wdrops{display:flex;gap:5px}
.wdrops i{width:10px;height:10px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:block;
 background:rgba(8,14,10,.5);border:2px solid rgba(0,0,0,.55)}
.wdrops i.on{background:var(--cyan);border-color:#0b5e6e}
.boostb{width:34px;height:34px;border-radius:50%;background:linear-gradient(180deg,#39818f,#1c4c57);border:3px solid var(--ink);
 cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.boostb img{width:24px;height:24px}
.boostb:hover{background:linear-gradient(180deg,#4aa3b4,#256776)}
.tagmini{display:flex;gap:4px;align-items:center;white-space:nowrap}
.tagmini span{font-size:11px;font-weight:800;padding:1px 7px;border-radius:9px;border:2px solid var(--ink);background:rgba(18,14,10,.8);color:#fff}
.tagmini span.bl{background:#caa12c;color:#2a1e04}
.tagmini span.st{background:#a83f2c}
/* 地块左上角标：良田 / 变异词条 */
.ptag{position:absolute;left:4px;top:calc(50% - 34px);display:flex;flex-direction:column;gap:3px;z-index:6;white-space:nowrap;align-items:flex-start}
.mchip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:9px;color:#1A1A1A;border:2px solid #1A1A1A}
.m1{background:#7fd0ff}.m2{background:#c9b4ff}.m3{background:#ffd76e}.m4{background:#ff9d6e}
/* 空地：一个 + 圆钮，悬停出种子名 */
.plusb{position:absolute;left:50%;bottom:calc(var(--cropBase) - 24px);width:48px;height:48px;margin-left:-24px;border-radius:50%;
 background:rgba(255,255,255,.22);border:3px dashed rgba(255,255,255,.85);z-index:5;display:flex;align-items:center;justify-content:center;
 font-size:34px;font-weight:800;color:#fff;line-height:1;padding-bottom:4px;text-shadow:0 2px 3px rgba(0,0,0,.45);
 transition:transform .15s ease,background .15s ease}
.plot.empty:hover .plusb{transform:scale(1.1);background:rgba(62,238,0,.55);border-style:solid}
.plusb.no{border-color:rgba(255,120,100,.9);color:#ffb3a6}
.hov{position:absolute;left:50%;bottom:calc(var(--cropBase) + 34px);transform:translateX(-50%);white-space:nowrap;font-size:13px;
 background:rgba(18,14,10,.82);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;z-index:6;opacity:0;transition:opacity .15s}
.plot.empty:hover .hov{opacity:1}
/* 未开垦：木牌 */
.sign{position:absolute;left:50%;bottom:calc(var(--cropBase) - 18px);transform:translateX(-50%);z-index:6;white-space:nowrap;text-align:center;
 background:linear-gradient(180deg,#8f5f2f,#6a4220);border:3px solid #3d2612;border-radius:10px;padding:5px 12px;font-size:14px;color:#fff;
 line-height:1.3;box-shadow:0 3px 0 #2b1a0b,0 5px 8px rgba(0,0,0,.35)}
.sign b{color:var(--gold);font-weight:800}
.sign .lk{font-style:normal;margin-right:5px;font-size:13px;opacity:.9}
.sign.can{background:linear-gradient(180deg,#ffd34d,#e09a12);border-color:#7a4a00;color:#3A2A00;animation:bob 1.6s ease-in-out infinite}
.sign.can b{color:#3A2A00}
.sign.pay{background:linear-gradient(180deg,#5a3d8a,#3d2666);border-color:#22133d}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
/* 串门时谁家 */
#owner{position:absolute;left:50%;top:326px;transform:translateX(-50%);z-index:12;display:none;align-items:center;gap:10px;
 padding:6px 18px 6px 8px;border-radius:30px;background:rgba(10,12,8,.78);border:3px solid var(--gold);font-size:18px;white-space:nowrap}
#owner.show{display:flex}
#owner img{width:38px;height:38px;border-radius:50%}

/* ── 右下：看园巨猿 + 活动倒计时/状态 ── */
#guard{right:8px;bottom:92px;width:250px;cursor:pointer;z-index:9;transition:transform .15s}
#guard:hover{transform:translateY(-3px)}
#guard img{width:100%;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));position:relative;z-index:2}
#guard::after{content:"";position:absolute;left:18%;right:18%;bottom:6px;height:26px;border-radius:50%;
 background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 72%);z-index:1}
#guardTag{position:absolute;left:50%;top:-16px;transform:translateX(-50%);white-space:nowrap;
 font-size:15px;background:rgba(10,12,8,.82);border:3px solid var(--ink);border-radius:16px;padding:3px 12px}
#status{right:270px;bottom:20px;width:344px;padding:10px 14px 10px;border-radius:14px;z-index:8;
 background:rgba(10,12,8,.72);border:3px solid var(--ink)}
#status .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:22px;line-height:1.1}
#status .r1 small{font-size:13px;font-weight:700}
#status .r2{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.sc{font-size:12px;font-weight:800;padding:2px 9px;border-radius:10px;border:2px solid rgba(0,0,0,.6);background:rgba(255,255,255,.12);color:#fff;
 white-space:nowrap;display:flex;align-items:center;gap:4px}
.sc.c{color:var(--cyan)} .sc.gold{background:linear-gradient(90deg,#8a6a22,#c99a2b);color:#fff}
.sc img{width:16px;height:16px}

function rollMut(p){const c=crop(p.crop),t=TIER[c.t];
 let pm=Math.pow(1.2,Math.min(p.bless,3));
 if(p.stolenB)pm*=1.2; if(p.gold)pm*=2; if(p.forced)pm*=2; pm*=sk('mut')||1;
 pm=Math.min(pm,4);
 const out=[];
 if(Math.random()<t.p.theme*pm)out.push('theme');
 const rest=['color','mat','giant'].filter(k=>Math.random()<t.p[k]*pm);
 const cap=out.length?3:2;
 for(const k of rest){if(out.length>=cap)break;out.push(k);}
 let mul=1;out.forEach(k=>mul*=FORM[k].m);
 return {mut:out,mul};}

// 等距菱形交错阵（照白泽农场 / 精灵农场参考）：地块 (i,j) 落在旋转 45° 的格点上，
// x = cx + (i−j)·ux, y = top + (i+j)·uy；近的压远的；小而紧凑，草坪留白
const ISO={cx:900,top:445,w:270,h:135,t:10,pad:6,gx:34,gy:17,cols:4};
ISO.W=ISO.w+ISO.pad*2;ISO.H=ISO.h+ISO.t+ISO.pad*2+6;ISO.ux=(ISO.w+ISO.gx)/2;ISO.uy=(ISO.h+ISO.gy)/2;
const NPCF={top:520};
function rowK(){return 1;}
function plotPos(i,cols,opt){const a=i%cols,b=(i/cols)|0,top=(opt&&opt.top)||ISO.top;
 return {x:ISO.cx+(a-b)*ISO.ux-ISO.W/2, y:top+(a+b)*ISO.uy-ISO.pad};}
function plotStyle(i,cols,opt){const q=plotPos(i,cols,opt);
 return ' style="left:'+q.x.toFixed(1)+'px;top:'+q.y.toFixed(1)+'px;z-index:'+(10+Math.round(q.y/8))+'"';}
function hudWrap(i,cols,opt,inner,key){const q=plotPos(i,cols,opt);
 return '<div class="hudp" data-'+(key||'i')+'="'+i+'" style="left:'+(q.x+ISO.W/2).toFixed(1)+'px;top:'+(q.y+ISO.pad+ISO.h+ISO.t/2).toFixed(1)+'px;z-index:'+(10+Math.round(q.y/8))+'">'+inner+'</div>';}
/* ═══════ 苗床：程序画。正面机位的对称梯形、贴地（只留 6px 前沿）、边缘和草坪软融合；
   未开垦不铺板 = 虚线 + 略暗草地 + 草撮，视觉上退后。一次离屏渲染成 2× 精灵，之后当普通 <img> 用 ═══════ */
function makeBed(kind){
 const R=2,w=ISO.w,h=ISO.h,t=ISO.t,pad=ISO.pad,W=ISO.W,H=ISO.H;
 const cv=document.createElement('canvas');cv.width=W*R;cv.height=H*R;const g=cv.getContext('2d');g.scale(R,R);
 let seed=kind==='gold'?7:kind==='wild'?13:kind==='goldlock'?21:3;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const P0=[W/2,pad];                                   // 上顶点；d1 沿右下边，d2 沿左下边
 const pt=(sx,r)=>[P0[0]+sx*w/2-r*w/2, P0[1]+sx*h/2+r*h/2];
 const poly=(pts,dy)=>{dy=dy||0;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]+dy):g.moveTo(q[0],q[1]+dy));g.closePath();};
 const face=(a,b)=>poly([pt(a,a),pt(b,a),pt(b,b),pt(a,b)]);      // 内缩的菱形（a≈0,b≈1 为整块）
 const strip=(r0,r1,s0,s1)=>poly([pt(s0,r0),pt(s1,r0),pt(s1,r1),pt(s0,r1)]);
 const soft=fn=>{try{g.filter='blur(3px)';}catch(e){}fn();try{g.filter='none';}catch(e){}};
 const gold=kind==='gold'||kind==='goldlock', wild=kind==='wild', lockIn=kind==='goldlock';
 const [p0,p1,p2,p3]=[pt(0,0),pt(1,0),pt(1,1),pt(0,1)];

function makeGround(rows,top){
 const key=rows+'_'+top;if(GROUND[key])return GROUND[key];
 const m=0.32,t2=12,cols=ISO.cols;

 const c=[G(-m,-m),G(cols+m,-m),G(cols+m,rows+m),G(-m,rows+m)];   // 上/右/下/左 四角
 const minx=c[3][0]-30,maxx=c[1][0]+30,miny=c[0][1]-20,maxy=c[2][1]+t2+30;
 const W=Math.ceil(maxx-minx),H=Math.ceil(maxy-miny);
 const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.translate(-minx,-miny);
 const poly=(pts,dy)=>{dy=dy||0;g.beginPath();pts.forEach((q,i)=>i?g.lineTo(q[0],q[1]+dy):g.moveTo(q[0],q[1]+dy));g.closePath();};
 let seed=99;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 // 接地阴影
 try{g.filter='blur(8px)';}catch(e){}
 g.fillStyle='rgba(20,40,10,.38)';poly(c,t2+6);g.fill();
 try{g.filter='none';}catch(e){}
 // 两个近侧面（薄厚度）
 g.fillStyle='#7f9f4c';poly([c[1],c[2],[c[2][0],c[2][1]+t2],[c[1][0],c[1][1]+t2]]);g.fill();
 g.fillStyle='#6a8a3f';poly([c[3],c[2],[c[2][0],c[2][1]+t2],[c[3][0],c[3][1]+t2]]);g.fill();
 g.fillStyle='rgba(0,0,0,.15)';poly([c[1],c[2],[c[2][0],c[2][1]+3],[c[1][0],c[1][1]+3]]);g.fill();poly([c[3],c[2],[c[2][0],c[2][1]+3],[c[3][0],c[3][1]+3]]);g.fill();
 // 台面：比草坪略亮的草色，带修剪条纹
 const gr=g.createLinearGradient(c[0][0],c[0][1],c[2][0],c[2][1]);gr.addColorStop(0,'#d3e9a6');gr.addColorStop(1,'#b7d67f');
 g.fillStyle=gr;g.strokeStyle=gr;g.lineWidth=6;g.lineJoin='round';poly(c);g.fill();g.stroke();
 g.save();poly(c);g.clip();
 for(let k=0;k<12;k++){const b0=-m+(rows+2*m)*k/12,b1=b0+(rows+2*m)/24;

 g.strokeStyle='rgba(70,115,40,.45)';g.lineWidth=3;poly(c);g.stroke();
 const cols3=['rgba(255,255,255,.85)','rgba(255,227,110,.8)','rgba(255,183,213,.75)','rgba(255,255,255,.85)'];
 for(let i=0;i<28;i++){let a,b;
  if(rnd()<.5){a=-m+rnd()*m*.9; if(rnd()<.5)a=cols+m-rnd()*m*.9; b=-m+rnd()*(rows+2*m);}
  else{b=-m+rnd()*m*.9; if(rnd()<.5)b=rows+m-rnd()*m*.9; a=-m+rnd()*(cols+2*m);}

 return GROUND[key]={url:cv.toDataURL('image/png'),x:minx,y:miny};}

let last=performance.now(),acc=0,raidT=0,blessT=0,rankT=0;
function tick(now){
 const dt=S.ended?0:Math.min(now-last,500)*S.speed;last=now;
 S.dayT+=dt;
 if(S.dayT>=DAY_MS){S.dayT-=DAY_MS;S.day++;S.stealLeft=60;S.blessLeft=10;S.blessRecv=0;S.boostBought=0;S.bDay={};
  log('进入活动第 <b>'+S.day+'</b> 天'+(isWeekend()?'，<b>丰收周末</b> 售价 ×2':''),isWeekend()?'gold':'');
  if(isWeekend())toast('丰收周末：本时段成熟的作物售价 ×2','gold');
  renderAll();}
 let dirty=false;
 S.plots.forEach(p=>{if(p.crop&&!p.mature){p.remain-=dt;
  if(p.remain<=0){p.remain=0;mature(p);dirty=true;renderOps();}else dirty=true;}});
 S.npcFarms.forEach(f=>f.forEach(q=>{if(!q.mature){q.remain-=dt;
  if(q.remain<=0){q.mature=1;const t=TIER[crop(q.c).t],out=[];
   if(Math.random()<t.p.theme*3)out.push('theme');
   ['color','mat','giant'].forEach(k=>{if(out.length<(out.length?3:2)&&Math.random()<t.p[k]*1.5)out.push(k)});
   q.mut=out;q.mul=out.reduce((a,k)=>a*FORM[k].m,1);}}}));
 raidT+=dt;if(raidT>22000){raidT=0;npcRaid();}
 rankT+=dt;if(rankT>4000){rivalsTick(rankT);rankT=0;}
 blessT+=dt;if(blessT>7000){blessT=0;npcBless();}
 acc+=dt;
 if(acc>260){acc=0;if(dirty||S.view==='npc')renderField();renderTop();renderBag();guideTick();}
 if(!S.ended&&S.day>DAYS){S.ended=1;S.day=DAYS;S.dayT=DAY_MS-1;openPop('end');}
 requestAnimationFrame(tick);}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P2 节日数据回归 · 总览</title>
<style>
  :root{
    --bg:#f4f6f9; --panel:#ffffff; --ink:#1f2733; --muted:#7c8696;
    --line:#e7ebf1; --line2:#eef1f6; --accent:#3a6df0; --accent-soft:#eef3ff;
    --sidebar:#fafbfd;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:268px; flex:0 0 268px; height:100vh; background:var(--sidebar);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    transition:margin-left .22s ease;
  }
  body.collapsed #sidebar{ margin-left:-268px; }

  .brand{ padding:18px 18px 14px; border-bottom:1px solid var(--line); }
  .brand .logo{ font-size:15px; font-weight:700; letter-spacing:.3px; display:flex; align-items:center; gap:8px; }
  .brand .logo .dot{ width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#3a6df0,#7c5cff); box-shadow:0 0 0 3px #e7ecfb; }
  .brand .tag{ font-size:11.5px; color:var(--muted); margin-top:6px; }

  .nav{ flex:1; overflow-y:auto; padding:10px 10px 24px; }
  .nav::-webkit-scrollbar{width:8px} .nav::-webkit-scrollbar-thumb{background:#dfe4ec;border-radius:8px}

  .group{ margin-bottom:6px; }
  .group-head{
    display:flex; align-items:center; gap:8px; width:100%; cursor:pointer;
    padding:9px 10px; border:0; background:transparent; border-radius:9px;
    font:inherit; color:var(--ink); text-align:left;
  }
  .group-head:hover{ background:#f0f2f7; }
  .group-head .gicon{ font-size:15px; }
  .group-head .gname{ font-weight:650; font-size:13.5px; flex:1; }
  .group-head .gcount{ font-size:11px; color:var(--muted); background:#eef1f6; border-radius:20px; padding:1px 8px; }
  .group-head .chev{ font-size:10px; color:var(--muted); transition:transform .18s ease; }
  .group.closed .chev{ transform:rotate(-90deg); }
  .group-date{ font-size:10.5px; color:var(--muted); padding:0 10px 4px 34px; margin-top:-2px; }

  .group-body{ overflow:hidden; }
  .group.closed .group-body{ display:none; }

  .item{
    display:block; width:100%; text-align:left; cursor:pointer; position:relative;
    border:0; background:transparent; font:inherit; color:var(--ink);
    padding:9px 10px 9px 16px; border-radius:9px; margin:2px 2px;
  }
  .item:hover{ background:#f0f2f7; }
  .item::before{
    content:""; position:absolute; left:4px; top:13px; width:7px;height:7px;border-radius:50%;
    background:var(--c,#9aa4b2);
  }
  .item .it-title{ font-size:13px; font-weight:600; padding-left:8px; }
  .item .it-meta{ font-size:10.5px; color:var(--muted); padding-left:8px; margin-top:2px; }
  .item.active{ background:var(--accent-soft); }
  .item.active .it-title{ color:var(--accent); }
  .item.active::after{ content:""; position:absolute; left:0; top:7px; bottom:7px; width:3px; border-radius:3px; background:var(--c,var(--accent)); }

  /* ---------- Main ---------- */
  #main{ flex:1; height:100vh; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    height:56px; flex:0 0 56px; background:var(--panel); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; padding:0 16px;
  }
  .hamb{
    width:34px;height:34px; border:1px solid var(--line); background:#fff; border-radius:9px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--muted); flex:0 0 auto;
  }
  .hamb:hover{ background:#f5f7fa; color:var(--ink); }
  .tb-meta{ min-width:0; flex:1; }
  .tb-title{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb-title .pip{ display:inline-block; width:8px;height:8px;border-radius:50%; margin-right:7px; vertical-align:middle; background:var(--accent); }
  .tb-sub{ font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .tb-actions{ display:flex; gap:8px; flex:0 0 auto; }
  .tb-actions a, .tb-actions button{
    font:inherit; font-size:12px; color:var(--ink); text-decoration:none; cursor:pointer;
    border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 11px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tb-actions a:hover, .tb-actions button:hover{ background:#f5f7fa; border-color:#d6dce6; }

  .frame-wrap{ flex:1; position:relative; background:#fff; }
  iframe#viewer{ width:100%; height:100%; border:0; display:block; background:#fff; }

  @media (max-width:820px){
    #sidebar{ position:fixed; z-index:20; box-shadow:2px 0 18px rgba(20,30,60,.12); }
    body:not(.collapsed) #main::after{ content:""; position:fixed; inset:0 0 0 268px; background:rgba(20,30,60,.18); z-index:10; }
  }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <div class="logo"><span class="dot"></span>P2 节日数据回归</div>
      <div class="tag">按节日分类 · 点击左侧切换报告</div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <section id="main">
    <header class="topbar">
      <button class="hamb" id="toggle" title="收起/展开侧栏">☰</button>
      <div class="tb-meta">
        <div class="tb-title" id="tbTitle"><span class="pip"></span>—</div>
        <div class="tb-sub" id="tbSub"></div>
      </div>
      <div class="tb-actions">
        <button id="reloadBtn" title="刷新当前报告">⟳ 刷新</button>
        <a id="openBtn" target="_blank" rel="noopener" title="在新标签页打开">↗ 新标签页</a>
      </div>
    </header>
    <div class="frame-wrap">
      <iframe id="viewer" title="报告内容"></iframe>
    </div>
  </section>

<script>
/* ============================================================
   报告目录 —— 新增节日/报告只需在此数组追加一项即可
   ============================================================ */
const DATA = [
  {
    festival: "拓荒节 2026",
    icon: "⛏️",
    date: "2026-05 档 · 6/17 更新",
    open: true,
    reports: [
      {
        id: "dighole7",
        title: "挖孔七期 · 新挖孔",
        meta: "21127899 · 05-26~06-02",
        file: "dighole7-pioneer-regression.html",
        color: "#e8821e",
        sub: "营收创挖孔系列新高 · 全节日付费第一（占比 36.1%）· 涨幅来自 ARPPU 深度"
      },
      {
        id: "marble",
        title: "弹珠 GACHA · 升级版",
        meta: "21127806 · 05-19~05-26",
        file: "marble-pioneer-regression.html",
        color: "#7c5cff",
        sub: "升级版新弹珠首期 · 海外(fo) · 横比 周年庆/万圣/圣诞/科技 4 期旧弹珠"
      },
      {
        id: "unite",
        title: "联动礼包 · 头像框",
        meta: "21129002 · 05-12~06-02",
        file: "labor2026-unite-regression.html",
        color: "#d4a017",
        sub: "头像框本节首发 · 礼包全周期 $31,615 · 净增 +$6,334（25.1%，头像框驱动）"
      }
    ]
  }
];

const nav = document.getElementById("nav");
const viewer = document.getElementById("viewer");
const tbTitle = document.getElementById("tbTitle");
const tbSub = document.getElementById("tbSub");
const openBtn = document.getElementById("openBtn");
const byId = {};

DATA.forEach((g, gi) => {
  const group = document.createElement("div");
  group.className = "group" + (g.open ? "" : " closed");

  const head = document.createElement("button");
  head.className = "group-head";
  head.innerHTML =
    `<span class="gicon">${g.icon || "📁"}</span>` +
    `<span class="gname">${g.festival}</span>` +
    `<span class="gcount">${g.reports.length}</span>` +
    `<span class="chev">▼</span>`;
  head.addEventListener("click", () => group.classList.toggle("closed"));
  group.appendChild(head);

  if (g.date) {
    const d = document.createElement("div");
    d.className = "group-date";
    d.textContent = g.date;
    group.appendChild(d);
  }

  const body = document.createElement("div");
  body.className = "group-body";
  g.reports.forEach(r => {
    byId[r.id] = r;
    const it = document.createElement("button");
    it.className = "item";
    it.style.setProperty("--c", r.color || "#3a6df0");
    it.dataset.id = r.id;
    it.innerHTML = `<div class="it-title">${r.title}</div><div class="it-meta">${r.meta || ""}</div>`;
    it.addEventListener("click", () => select(r.id, true));
    body.appendChild(it);
  });
  group.appendChild(body);
  nav.appendChild(group);
});

function resolveSrc(file){
  // 经 htmlpreview.github.io 代理打开时，iframe 的相对路径会解析到错误域，
  // 这里把子报告也拼成 htmlpreview 绝对地址（仓库路径从当前 URL 推导，不写死）。
  if (location.hostname === "htmlpreview.github.io") {
    const wrapped = decodeURIComponent(location.search.slice(1)); // index.html 的 github blob 地址
    const dir = wrapped.replace(/\/[^\/]*$/, "/");                // .../reports/
    return "https://htmlpreview.github.io/?" + dir + file;
  }
  return file + "?_t=" + Date.now();  // 本地/Pages：相对路径 + 缓存破坏，始终载入最新版
}

function select(id, fromClick){
  const r = byId[id];
  if (!r) return;
  // ensure containing group is open
  viewer.setAttribute("src", resolveSrc(r.file));
  tbTitle.innerHTML = `<span class="pip" style="background:${r.color}"></span>${r.title}`;
  tbSub.textContent = r.sub || r.meta || "";
  openBtn.setAttribute("href", resolveSrc(r.file));
  document.querySelectorAll(".item").forEach(el =>
    el.classList.toggle("active", el.dataset.id === id));
  const activeEl = document.querySelector(`.item[data-id="${id}"]`);
  if (activeEl){ const grp = activeEl.closest(".group"); if (grp) grp.classList.remove("closed"); }
  if (history.replaceState) history.replaceState(null, "", "#" + id);
  if (fromClick && document.body.classList.contains("collapsed") === false && window.innerWidth <= 820){
    document.body.classList.add("collapsed");
  }
}

document.getElementById("toggle").addEventListener("click", () =>
  document.body.classList.toggle("collapsed"));
document.getElementById("reloadBtn").addEventListener("click", () => {
  const active = document.querySelector(".item.active");
  if (active) viewer.setAttribute("src", resolveSrc(byId[active.dataset.id].file));
});

// initial: hash deep-link or first report
const initial = (location.hash || "").replace("#", "");
select(byId[initial] ? initial : DATA[0].reports[0].id, false);
</script>
</body>
</html>
